    log('');
    log('=== CLOUD SESSION ===');
    log('Token: '+(CLOUD.token?'present ('+CLOUD.token.slice(0,16)+'...)':'MISSING'),!!CLOUD.token);
    log('User ID: '+(CLOUD.user?CLOUD.user.slice(0,16)+'...':'MISSING'),!!CLOUD.user);
    log('Biz ID: '+(CLOUD.bizId?CLOUD.bizId:'MISSING'),!!CLOUD.bizId);
    log('Email: '+(S.cloudEmail||'not set'),!!S.cloudEmail);
    if(!CLOUD.token){log('Cannot run cloud checks — not signed in.',false);diagBtn.disabled=false;diagBtn.textContent='Run diagnostics';return;}
    log('');
    log('=== SUPABASE CONNECTION ===');
    try{
      const r=await fetch(SUPA_URL+'/rest/v1/businesses?id=eq.'+CLOUD.bizId,{headers:cloudHeaders()});
      if(r.ok){
        const d=await r.json();
        if(d&&d[0]){log('Business record found: "'+d[0].name+'"',true);log('Has settings: '+(!!d[0].settings),!!d[0].settings);}
        else log('Business record NOT found in Supabase — wrong bizId?',false);
      } else {
        const txt=await r.text();
        if(r.status===401)log('Auth failed (401) — session expired. Sign out and sign in.',false);
        else log('Business fetch failed: HTTP '+r.status,false);
      }
    }catch(e){log('Network error: '+e.message,false);}
    log('');
    log('=== PRODUCTS ===');
    try{
      const r=await fetch(SUPA_URL+'/rest/v1/products?biz_id=eq.'+CLOUD.bizId,{headers:cloudHeaders()});
      if(r.ok){const d=await r.json();log('Products in Supabase: '+d.length,(d.length>0));
        if(d.length!==S.prods.length)log('Mismatch: local has '+S.prods.length+' but cloud has '+d.length,'warn');
        else log('Local and cloud product count match',true);
      } else log('Products fetch failed: HTTP '+r.status,false);
    }catch(e){log('Products error: '+e.message,false);}
    log('');
    log('=== EMPLOYEES ===');
    try{
      const r=await fetch(SUPA_URL+'/rest/v1/employees?biz_id=eq.'+CLOUD.bizId+'&active=eq.true',{headers:cloudHeaders()});
      if(r.ok){const d=await r.json();log('Active employees in Supabase: '+d.length,(d.length>=0),d.length===0?'warn':true);
      } else log('Employees fetch failed: HTTP '+r.status,false);
    }catch(e){log('Employees error: '+e.message,false);}
    log('');
    log('=== INGREDIENTS ===');
    try{
      const r=await fetch(SUPA_URL+'/rest/v1/ingredients?biz_id=eq.'+CLOUD.bizId,{headers:cloudHeaders()});
      if(r.ok){const d=await r.json();log('Ingredients in Supabase: '+d.length,d.length>0);}
      else log('Ingredients fetch failed: HTTP '+r.status,false);
    }catch(e){log('Ingredients error: '+e.message,false);}
    log('');
    log('=== SALES ===');
    try{
      const r=await fetch(SUPA_URL+'/rest/v1/sales?biz_id=eq.'+CLOUD.bizId+'&limit=1',{headers:cloudHeaders()});
      if(r.ok){const d=await r.json();log('Sales records in Supabase: '+(d.length>0?'found (latest: '+d[0].txn_id+')':'none yet'),d.length>0?true:'warn');}
      else log('Sales fetch failed: HTTP '+r.status,false);
    }catch(e){log('Sales error: '+e.message,false);}
    log('');
    log('=== UPDATE SERVER ===');
    try{
      const r=await fetch(VERSION_URL+'?t='+Date.now());
      if(r.ok){const d=await r.json();const latest=d.version||'?';const upToDate=latest===CR.ver;
        log('Update server reachable',true);
        log('Latest version: v'+latest+' (you have v'+CR.ver+')',upToDate?true:'warn');
      } else log('Update server unreachable: HTTP '+r.status,'warn');
    }catch(e){log('Update server error (may be offline): '+e.message,'warn');}
    log('');
    log('=== DONE ===',true);
    diagBtn.disabled=false;diagBtn.textContent='Run diagnostics';
  };
  diagCard.appendChild(diagBtn);diagCard.appendChild(diagLog);
  body.appendChild(diagCard);

  scr.appendChild(body);
}

function renderModal(app){
  const m=S.modal;
  const ov=document.createElement('div');ov.className='ov open';
  ov.onclick=function(e){if(e.target===ov)closeModal();};

  const modal=document.createElement('div');modal.className='modal';
  const drag=document.createElement('div');drag.className='mdrag';modal.appendChild(drag);
  const body=document.createElement('div');body.className='mbody';

  if(m.type==='pay'){
    const id=txId();const isCash=m.method==='Cash';const ct=S.cashTendered||0;const change=ct-tot();

    if(isCash){
      // Amount display
      const disp=document.createElement('div');disp.className='cash-disp';
      disp.innerHTML='<div class="cash-lbl">Amount to pay</div><div class="cash-amt">'+fmt(tot())+'</div>';
      body.appendChild(disp);

      // Manual input
      const inpWrap=document.createElement('div');inpWrap.className='cash-inp-wrap';
      const inpLbl=document.createElement('div');inpLbl.className='cash-inp-lbl';inpLbl.textContent='Cash received from customer';
      const cashInp=document.createElement('input');cashInp.className='cash-inp';cashInp.type='number';cashInp.min='0';cashInp.inputMode='numeric';cashInp.placeholder='Type amount...';cashInp.value=ct>0?ct:'';
      inpWrap.appendChild(inpLbl);inpWrap.appendChild(cashInp);body.appendChild(inpWrap);

      // Quick buttons
      const qg=document.createElement('div');qg.className='qgrid';
      const exact=Math.ceil(tot());
      const r50=Math.ceil(tot()/50)*50;
      const r100=Math.ceil(tot()/100)*100;
      const r500=Math.ceil(tot()/500)*500;
      const r1000=Math.ceil(tot()/1000)*1000;
      const sugg=[...new Set([exact,r50,r100,r500,r1000].filter(v=>v>=tot()))].slice(0,4);

      const exactBtn=document.createElement('button');exactBtn.className='qbtn exact';exactBtn.textContent='Exact - '+fmt(tot());
      exactBtn.onclick=function(){cashInp.value=tot().toFixed(2);cashInp.dispatchEvent(new Event('input'));};
      qg.appendChild(exactBtn);

      [{add:50},{add:100},{add:500},{add:1000},{add:0,lbl:'Clear'}].forEach(q=>{
        const b=document.createElement('button');b.className='qbtn';b.textContent=q.lbl||('+'+q.add.toLocaleString());
        b.onclick=function(){
          if(q.add===0){cashInp.value='';cashInp.dispatchEvent(new Event('input'));}
          else{cashInp.value=(parseFloat(cashInp.value)||0)+q.add;cashInp.dispatchEvent(new Event('input'));}
        };
        qg.appendChild(b);
      });
      body.appendChild(qg);

      // Change display
      const changeBox=document.createElement('div');changeBox.className='change-box';
      const changeL=document.createElement('div');changeL.className='change-l';
      const changeLbl=document.createElement('div');changeLbl.className='change-lbl';changeLbl.textContent='Change';
      const changeVal=document.createElement('div');changeVal.className='change-val';changeVal.id='changeVal';
      changeVal.textContent=change>=0?fmt(change):'--';
      changeVal.style.color=change>=0?'var(--st)':'var(--dt)';
      changeL.appendChild(changeLbl);changeL.appendChild(changeVal);
      const changeR=document.createElement('div');changeR.className='change-r';
      changeR.innerHTML='<div class="change-lbl">Total</div><div class="total-val">'+fmt(tot())+'</div>';
      changeBox.appendChild(changeL);changeBox.appendChild(changeR);body.appendChild(changeBox);

      // Confirm button
      const confirmBtn=document.createElement('button');
      confirmBtn.className='confirm-btn'+(ct<tot()?' disabled':'');
      confirmBtn.textContent=ct>=tot()?'Confirm sale':'Enter cash amount';
      body.appendChild(confirmBtn);

      // Receipt
      const det=document.createElement('details');
      const sum=document.createElement('summary');sum.style.cssText='font-size:12px;color:var(--t3);cursor:pointer;padding:8px 0;text-align:center;list-style:none';sum.textContent='Show receipt preview';
      const rbox=document.createElement('div');rbox.className='rbox';rbox.style.marginTop='8px';rbox.id='receiptBox';rbox.textContent=receiptStr(m.method,id,'');
      det.appendChild(sum);det.appendChild(rbox);body.appendChild(det);

      // Cancel button
      const cancelBtn=document.createElement('button');cancelBtn.style.cssText='width:100%;padding:14px;border-radius:0;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:14px;font-weight:600;cursor:pointer;margin-top:4px';cancelBtn.textContent='Cancel';
      cancelBtn.onclick=closeModal;body.appendChild(cancelBtn);

      // Wire up cash input
      cashInp.addEventListener('input',function(){
        const v=parseFloat(this.value)||0;S.cashTendered=v;
        const ch=v-tot();
        const cv=document.getElementById('changeVal');
        if(cv){cv.textContent=ch>=0?fmt(ch):'--';cv.style.color=ch>=0?'var(--st)':'var(--dt)';}
        if(ch>=0){confirmBtn.className='confirm-btn';confirmBtn.textContent='Confirm sale';}
        else{confirmBtn.className='confirm-btn disabled';confirmBtn.textContent='Enter cash amount';}
      });
      setTimeout(()=>cashInp.focus(),100);

      confirmBtn.onclick=function(){
        if(S.cashTendered<tot()&&!S.chargeToUtang)return;
        const txid=txId();
        const payMethod=S.chargeToUtang?'Utang':'Cash';
        const tx={id:txid,date:new Date().toISOString(),items:S.cart.map(i=>({name:i.name,qty:i.qty,price:i.price,variantLabel:i.variantLabel||'',cat:i.cat||catOfSaleItem(i)})),total:tot(),disc:damt(),method:payMethod,receipt:receiptStr(payMethod,txid),customer:S.selectedCustomer?S.selectedCustomer.name:'',cashier:S.activeCashier?S.activeCashier.name:''};
        S.cart.forEach(ci=>{applyStockDelta(ci,-ci.qty);});
        const cartCopy=[...S.cart];
        const capturedCash=S.cashTendered;
        if(typeof QUEUE_CFG!=='undefined'&&QUEUE_CFG.enabled){tx.queueNo=S.pendingQueueNo||0;tx.queueStatus='waiting';tx.queueDay=(function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();}S.sales.push(tx);S.salesTotal+=tot();S.cart=[];S.disc=0;S.discType='%';S.cashTendered=0;S.cartOpen=false;S.pendingQueueNo=0;if(typeof __qzBadge==='function')__qzBadge();
        S.selectedCustomer=null;S.chargeToUtang=false;
        save();syncSaleToCloud(tx);recordCustomerSale(tx);consumeIngredients(cartCopy,-1);pushProductStock(cartCopy);
        closeModal();
        toast('Sale recorded - '+txid);
        openModal({type:'receiptReady',tx:tx,cashTendered:capturedCash});
      };

    } else {
      // Non-cash Card/GCash
      const titleEl=document.createElement('div');titleEl.className='mtitle';
      titleEl.textContent='Payment - '+m.method;body.appendChild(titleEl);
      // Total display
      const totD=document.createElement('div');
      totD.style.cssText='background:var(--bg0);border-radius:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center';
      totD.innerHTML='<span style="font-size:13px;font-weight:700;color:var(--t3);text-transform:uppercase">Total (VAT incl.)</span><span style="font-size:24px;font-weight:800">'+fmt(tot())+'</span>';
      body.appendChild(totD);
      // Reference number input if required
      let refInp=null;
      if(S.requireRef){
        const rf=document.createElement('div');rf.className='mf';
        rf.innerHTML='<label>Reference / Transaction number *</label>';
        refInp=document.createElement('input');refInp.type='text';
        refInp.placeholder='Enter reference number';
        refInp.style.cssText='width:100%;padding:14px;border-radius:0;border:2px solid var(--ac);background:var(--bg2);color:var(--t1);font-size:16px;outline:none';
        rf.appendChild(refInp);body.appendChild(rf);
      }
      // Receipt preview
      const det=document.createElement('details');
      const sumEl=document.createElement('summary');
      sumEl.style.cssText='font-size:12px;color:var(--t3);cursor:pointer;padding:8px 0;text-align:center;list-style:none';
      sumEl.textContent='Show receipt preview';
      const rb=document.createElement('div');rb.className='rbox';rb.style.marginTop='8px';rb.textContent=receiptStr(m.method,id,'');
      det.appendChild(sumEl);det.appendChild(rb);body.appendChild(det);
      // Buttons
      const btns=document.createElement('div');btns.className='mbtns';
      const cancelBtn=document.createElement('button');cancelBtn.textContent='Cancel';cancelBtn.onclick=closeModal;
      const confirmBtn=document.createElement('button');confirmBtn.className='mpri';
      confirmBtn.style.cssText='flex:1;font-size:15px;padding:14px';
      confirmBtn.textContent='Confirm sale';
      confirmBtn.onclick=function(){
        if(S.requireRef&&refInp&&!refInp.value.trim()){
          refInp.style.borderColor='var(--df)';refInp.focus();
          toast('Please enter reference number');return;
        }
        const txid=txId();const refNum=refInp?refInp.value.trim():'';
        const tx={id:txid,date:new Date().toISOString(),items:S.cart.map(i=>({name:i.name,qty:i.qty,price:i.price,variantLabel:i.variantLabel||'',cat:i.cat||catOfSaleItem(i)})),total:tot(),disc:damt(),method:m.method,ref:refNum,receipt:receiptStr(m.method,txid,refNum),customer:S.selectedCustomer?S.selectedCustomer.name:'',cashier:S.activeCashier?S.activeCashier.name:''};
        S.cart.forEach(ci=>{applyStockDelta(ci,-ci.qty);});
        const cartCopy2=[...S.cart];
        if(typeof QUEUE_CFG!=='undefined'&&QUEUE_CFG.enabled){tx.queueNo=S.pendingQueueNo||0;tx.queueStatus='waiting';tx.queueDay=(function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();}S.sales.push(tx);S.salesTotal+=tot();S.cart=[];S.disc=0;S.discType="%";S.cashTendered=0;S.cartOpen=false;S.pendingQueueNo=0;if(typeof __qzBadge==='function')__qzBadge();
        S.selectedCustomer=null;S.chargeToUtang=false;
        save();syncSaleToCloud(tx);recordCustomerSale(tx);consumeIngredients(cartCopy2,-1);pushProductStock(cartCopy2);
        closeModal();
        toast('Sale recorded - '+txid);
        openModal({type:'receiptReady',tx:tx,cashTendered:0});
      };
      btns.appendChild(cancelBtn);btns.appendChild(confirmBtn);body.appendChild(btns);
    }

  } else if(m.type==='receiptReady'){
    // ── POST-SALE RECEIPT MODAL ──
    const tx=m.tx;
    const cashTendered=m.cashTendered||0;
    const change=cashTendered>0?Math.max(0,cashTendered-tx.total):0;

    // Big success checkmark
    const success=document.createElement('div');
    success.style.cssText='text-align:center;padding:10px 0 4px';
    success.innerHTML='<div style="font-size:48px">✓</div>'
      +'<div style="font-size:18px;font-weight:800;color:var(--st);margin-top:4px">Sale Recorded!</div>'
      +'<div style="font-size:12px;color:var(--t3);margin-top:4px">'+tx.id+'</div>';
    body.appendChild(success);

    // Change amount (cash only)
    if(cashTendered>0){
      const chBox=document.createElement('div');
      chBox.style.cssText='background:var(--sg);border:1.5px solid var(--st);border-radius:0;padding:14px;text-align:center;margin:8px 0';
      chBox.innerHTML='<div style="font-size:11px;font-weight:700;color:var(--st);text-transform:uppercase;letter-spacing:.5px">Change Due</div>'
        +'<div style="font-size:28px;font-weight:800;color:var(--st)">PHP '+change.toFixed(2)+'</div>';
      body.appendChild(chBox);
    }

    // Summary row
    const sumRow=document.createElement('div');
    sumRow.style.cssText='background:var(--bg2);border-radius:0;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin:6px 0';
    sumRow.innerHTML='<div>'
      +'<div style="font-size:13px;font-weight:600">'+tx.items.map(i=>i.name+' x'+i.qty).join(', ')+'</div>'
      +'<div style="font-size:11px;color:var(--t3);margin-top:2px">'+tx.method+(tx.cashier?' · '+tx.cashier:'')+'</div>'
      +'</div>'
      +'<div style="font-size:18px;font-weight:800;color:var(--ac);flex-shrink:0;margin-left:12px">PHP '+tx.total.toFixed(2)+'</div>';
    body.appendChild(sumRow);

    // Action buttons
    const btns=document.createElement('div');
    btns.style.cssText='display:flex;gap:8px;margin-top:8px';

    const printBtn=document.createElement('button');
    printBtn.className='mpri';
    printBtn.style.cssText='flex:2;padding:14px;font-size:15px;font-weight:700;border-radius:0;border:none;background:var(--ac);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px';
    printBtn.innerHTML='🖨️ Print Receipt';
    printBtn.onclick=function(){
      // Temporarily restore cashTendered for print
      const prevCash=S.cashTendered;
      S.cashTendered=cashTendered;
      printReceipt(tx);
      S.cashTendered=prevCash;
    };

    const doneBtn=document.createElement('button');
    doneBtn.style.cssText='flex:1;padding:14px;font-size:14px;font-weight:600;border-radius:0;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);cursor:pointer';
    doneBtn.textContent='Done';
    doneBtn.onclick=closeModal;

    btns.appendChild(printBtn);btns.appendChild(doneBtn);
    body.appendChild(btns);

  } else if(m.type==='viewtx'){
    /* The breakdown used to be nothing but `rb.textContent=m.tx.receipt` — the
       pre-rendered receipt string. That string is produced at checkout and
       held only on the till: salePayload() never sent a `receipt` column, so
       the cloud copy has none, and loadCloudData() replaces S.sales wholesale
       with the cloud copy. The upshot was that any sync — or opening the till
       on a second device — blanked the breakdown for every past transaction.

       It is now rebuilt from tx.items, which IS synced, so the breakdown
       survives a sync and works on any device. The original receipt text is
       still shown underneath when the device happens to have it. */
    const tx=m.tx;
    body.innerHTML='<div class="mtitle">'+esc(tx.id)
      +(tx.voided?'<span style="font-size:12px;color:var(--dt);margin-left:8px;font-weight:400">VOIDED</span>':'')+'</div>';

    // Header facts: when, who, how paid, reference.
    const meta=document.createElement('div');
    meta.style.cssText='font-size:12px;color:var(--t3);line-height:1.7;margin-bottom:10px';
    const bits=[new Date(tx.date).toLocaleString('en-PH',{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})];
    if(tx.cashier)bits.push('Cashier: '+tx.cashier);
    bits.push('Paid by '+(tx.method||'Cash'));
    if(tx.ref)bits.push('Ref: '+tx.ref);
    if(tx.customer)bits.push('Customer: '+tx.customer);
    if(tx.queueNo)bits.push('Queue #'+tx.queueNo);
    meta.textContent=bits.join(' · ');
    body.appendChild(meta);

    if(tx.voided&&tx.voidedBy){
      const vbi=document.createElement('div');
      vbi.style.cssText='font-size:12px;color:var(--dt);margin:-6px 0 10px';
      vbi.textContent='Voided by: '+tx.voidedBy+(tx.voidedAt?' \u00b7 '+new Date(tx.voidedAt).toLocaleString():'');
      body.appendChild(vbi);
    }

    // Itemised lines with qty, unit price and line total.
    const items=Array.isArray(tx.items)?tx.items:[];
    const box=document.createElement('div');
    box.style.cssText='background:var(--bg0);border:1px solid var(--b1);border-radius:0;padding:11px 13px';
    const bh=document.createElement('div');
    bh.style.cssText='font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;display:flex;justify-content:space-between';
    bh.innerHTML='<span>Items</span><span style="display:grid;grid-template-columns:34px 84px;gap:4px;text-align:center"><span>Qty</span><span style="text-align:right">Total</span></span>';
    box.appendChild(bh);

    if(!items.length){
      const em=document.createElement('div');
      em.style.cssText='font-size:12.5px;color:var(--t3);padding:6px 0';
      em.textContent='This transaction has no item detail stored.';
      box.appendChild(em);
    }
    let lineSum=0,qtySum=0;
    items.forEach(function(it){
      const q=+it.qty||0,pr=+it.price||0,lt=pr*q;
      lineSum+=lt;qtySum+=q;
      const row=document.createElement('div');
      row.style.cssText='display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--b1);font-size:13px';
      const nm=esc(it.name)+(it.variantLabel?' <span style="color:var(--t3);font-size:11.5px">('+esc(it.variantLabel)+')</span>':'');
      const sub='<span style="color:var(--t3);font-size:11px;display:block">'+fmt(pr)+' each'
        +(it.cat?' · '+esc(it.cat):'')+(it.note?' · '+esc(it.note):'')+'</span>';
      row.innerHTML='<span style="flex:1;min-width:0;color:var(--t1);font-weight:600">'+nm+sub+'</span>'
        +'<span style="display:grid;grid-template-columns:34px 84px;gap:4px;flex-shrink:0">'
        +'<span style="color:var(--t2);font-weight:700;text-align:center">'+q+'</span>'
        +'<span style="color:var(--t1);font-weight:700;text-align:right">'+fmt(lt)+'</span></span>';
      box.appendChild(row);
    });

    if(items.length){
      box.appendChild(drawerRow('Subtotal ('+qtySum+' item'+(qtySum===1?'':'s')+')',fmt(lineSum),{rule:true}));
      const disc=+tx.disc||0;
      if(disc>0)box.appendChild(drawerRow('Discount','-'+fmt(disc),{color:'var(--wt)'}));
      box.appendChild(drawerRow('Total',fmt(tx.total),{big:true,rule:true,color:tx.voided?'var(--t3)':'var(--ac)'}));
      /* If the lines do not add up to the recorded total, say so rather than
         showing two numbers that quietly disagree. */
      const drift=Math.round((lineSum-disc-(+tx.total||0))*100)/100;
      if(Math.abs(drift)>=0.01){
        const w=document.createElement('div');
        w.style.cssText='font-size:11px;color:var(--wt);padding-top:7px;line-height:1.5';
        w.textContent='Item lines add up to '+fmt(lineSum-disc)+', which is '+fmt(Math.abs(drift))
          +(drift>0?' more':' less')+' than the recorded total. The recorded total is what was taken.';
        box.appendChild(w);
      }
    }
    body.appendChild(box);

    // The original receipt text, when this device still has it.
    if(tx.receipt&&String(tx.receipt).trim()){
      const rb=document.createElement('div');rb.className='rbox';
      rb.style.marginTop='10px';rb.textContent=tx.receipt;
      body.appendChild(rb);
    }

    const b=document.createElement('div');b.className='mbtns';
    if(!tx.voided){
      const vb=document.createElement('button');vb.className='mvoid';vb.textContent='Void/Refund';
      vb.onclick=function(){
        // Voids restore stock and reduce revenue — require admin password
uiPrompt('Stock will be restored. Enter the admin password to authorise.',
          function(pw){
        if(pw===null)return;
        if(pw!==S.pass){toast('Incorrect admin password — void cancelled');return;}
        const tx2=S.sales.find(s=>s.id===m.tx.id);
        if(tx2){
          tx2.voided=true;
          tx2.voidedBy=S.activeCashier?S.activeCashier.name:'Admin';
          tx2.voidedAt=new Date().toISOString();
          S.salesTotal=Math.max(0,S.salesTotal-tx2.total);
          tx2.items.forEach(it=>{applyStockDelta(it,it.qty);});

    if(r.otherSales>0)box2.appendChild(drawerRow('Other',fmt(r.otherSales),{color:'var(--t2)'}));
    box2.appendChild(drawerRow('Total sales',fmt(r.totalSales||0),{big:true,rule:true,color:'var(--ac)'}));

    if(r.note||r.closeNote){

  } else if(m.type==='openShift'){

    const btns=document.createElement('div');btns.className='mbtns';

    go.onclick=function(){

      const now=new Date().toISOString();
      S.openShift={
        id:S.shiftNid++,cashier:c.name,cashierId:c.id!==undefined?c.id:null,
        supaId:c.supaId||null,startedAt:now,openingFloat:Math.round(v*100)/100,
        note:((document.getElementById('sfNote')||{}).value||'').trim(),endedAt:null
      };

      toast('Shift started · float '+fmt(v));
      render();
    };
    fi.onkeydown=function(e){if(e.key==='Enter')go.onclick();};
    btns.appendChild(cancel);btns.appendChild(go);body.appendChild(btns);
    setTimeout(function(){try{document.getElementById('sfFloat').focus();}catch(e){}},100);

  } else if(m.type==='closeShift'){
    /* End of shift: the sales for the shift are shown beside the drawer maths
       so the counted cash can be lined up against what was actually sold. */
    const sh=S.openShift;
    if(!sh){body.innerHTML='<div class="mtitle">No open shift</div>';
      const b2=document.createElement('div');b2.className='mbtns';
      const ok2=document.createElement('button');ok2.className='mpri';ok2.textContent='Close';ok2.onclick=closeModal;
      b2.appendChild(ok2);body.appendChild(b2);
    } else {
    const bd=shiftSalesBreakdown(sh);

    body.innerHTML='<div class="mbadge">Check out</div><div class="mtitle">Count the drawer</div>';

    const meta=document.createElement('div');
    meta.style.cssText='font-size:12px;color:var(--t3);line-height:1.6;margin-bottom:4px';
    meta.textContent=sh.cashier+' · started '+new Date(sh.startedAt).toLocaleString('en-PH',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    body.appendChild(meta);

    // Sales for the shift, so the drawer can be read against the takings.
    const sales=document.createElement('div');
    sales.style.cssText='background:var(--bg0);border:1px solid var(--b1);border-radius:0;padding:11px 13px;margin:8px 0';
    const sHd=document.createElement('div');
    sHd.style.cssText='font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px';
    sHd.textContent='Sales this shift · '+bd.count+' transaction'+(bd.count===1?'':'s');
    sales.appendChild(sHd);
    sales.appendChild(drawerRow('Cash',fmt(bd.cash),{color:'var(--st)'}));
    if(bd.gcash>0)sales.appendChild(drawerRow('GCash (not in drawer)',fmt(bd.gcash),{color:'var(--pt)'}));
    if(bd.credit>0)sales.appendChild(drawerRow('Credit (not in drawer)',fmt(bd.credit),{color:'var(--wt)'}));
    if(bd.other>0)sales.appendChild(drawerRow('Other (not in drawer)',fmt(bd.other),{color:'var(--t2)'}));
    sales.appendChild(drawerRow('Total sales',fmt(bd.total),{big:true,rule:true,color:'var(--ac)'}));
    if(bd.voided>0){
      const vn=document.createElement('div');
      vn.style.cssText='font-size:11px;color:var(--t3);padding-top:6px';
      vn.textContent=bd.voided+' voided sale'+(bd.voided===1?'':'s')+' excluded.';

    }

    // Paid out is editable: not every expense is settled from the drawer.
    const pf=document.createElement('div');pf.className='mf';pf.style.marginTop='4px';

    const pi=document.createElement('input');pi.id='csPaid';pi.type='number';pi.min='0';pi.step='any';
    pi.inputMode='decimal';pi.value=autoPaid?String(Math.round(autoPaid*100)/100):'0';
    pf.appendChild(pi);
    const ph=document.createElement('div');ph.style.cssText='font-size:11.5px;color:var(--t3);line-height:1.5';
    ph.textContent=autoPaid>0
      ?'Pre-filled from '+fmt(autoPaid)+' of expenses logged during this shift. Adjust if any were not paid from the drawer.'
      :'Leave at 0 if nothing was paid out of the drawer.';
    pf.appendChild(ph);body.appendChild(pf);

    // Expected cash, recomputed live as the two inputs change.
    const calc=document.createElement('div');
    calc.style.cssText='background:var(--bg0);border:1px solid var(--b1);border-radius:0;padding:11px 13px;margin:12px 0';
    body.appendChild(calc);

    const cf=document.createElement('div');cf.className='mf';

    nf2.innerHTML='<label>Note (optional)</label>';

    nf2.appendChild(ni2);body.appendChild(nf2);

    const repaint=function(){
      const paid=parseFloat(pi.value)||0;
      const exp=expectedDrawer(sh,paid);
      calc.innerHTML='';
      const ch=document.createElement('div');
      ch.style.cssText='font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px';
      ch.textContent='What the drawer should hold';
      calc.appendChild(ch);
      calc.appendChild(drawerRow('Opening float',fmt(sh.openingFloat||0)));
      calc.appendChild(drawerRow('+ Cash sales',fmt(bd.cash),{color:'var(--st)'}));
      calc.appendChild(drawerRow('− Cash paid out',fmt(paid),{color:paid>0?'var(--wt)':'var(--t2)'}));
      calc.appendChild(drawerRow('Expected cash',fmt(exp),{big:true,rule:true,color:'var(--ac)'}));

      const raw=ci.value;
      if(raw===''||raw===undefined||isNaN(parseFloat(raw))){
        verdict.style.background='var(--bg2)';verdict.style.border='1px solid var(--b1)';
        verdict.innerHTML='<div style="font-size:12.5px;color:var(--t3)">Enter the counted cash to see short or over.</div>';
        return;
      }
      const counted=parseFloat(raw);
      const v=Math.round((counted-exp)*100)/100;
      const vl=varianceLabel(v);
      verdict.style.background='var(--bg2)';verdict.style.border='1.5px solid '+vl.color;
      verdict.innerHTML='<div style="font-size:19px;font-weight:800;color:'+vl.color+'">'+esc(vl.text)+'</div>'
        +'<div style="font-size:11.5px;color:var(--t3);margin-top:4px;line-height:1.5">'+esc(vl.detail)+'</div>';
    };
    pi.oninput=repaint;ci.oninput=repaint;repaint();

    const btns=document.createElement('div');btns.className='mbtns';
    const cancel=document.createElement('button');cancel.textContent='Back';cancel.onclick=closeModal;
    const fin=document.createElement('button');fin.className='mpri';fin.textContent='End shift';
    fin.onclick=function(){
      const raw=ci.value;
      if(raw===''||isNaN(parseFloat(raw))||parseFloat(raw)<0){toast('Enter the counted cash on hand');return;}

      const counted=Math.round(parseFloat(raw)*100)/100;
      const exp=Math.round(expectedDrawer(sh,paid)*100)/100;
      const v=Math.round((counted-exp)*100)/100;
      const vl=varianceLabel(v);
      const finish=function(){
        const rec=Object.assign({},sh,{
          endedAt:new Date().toISOString(),paidOut:paid,expected:exp,
          countedCash:counted,variance:v,
          cashSales:bd.cash,gcashSales:bd.gcash,creditSales:bd.credit,
          otherSales:bd.other,totalSales:bd.total,txCount:bd.count,

         is never blocked — the count is what it is. */

  } else if(m.type==='deleteDaySales'){

    const key=m.date||dayKey(new Date());

      w.appendChild(cb);w.appendChild(tw);
      return w;

      'Returns the products and recipe ingredients these sales consumed. Leave off if you have already corrected stock by hand, or it will be added twice.'));

      opts.appendChild(mkCheck('dsExp','Also delete that day\u2019s expenses',
        sum.expenses.length+' expense entr'+(sum.expenses.length===1?'y':'ies')+' totalling '+fmt(sum.expTotal)+'.'));

    const cloudNote=document.createElement('div');

        :'The cloud copy for this date will be deleted too, so the sales will not come back on the next sync.');

    del.textContent='Delete '+sum.count+' sale'+(sum.count===1?'':'s');

      const alsoExp=!!(document.getElementById('dsExp')||{}).checked;

  } else if(m.type==='prod'){

            +'<td style="padding:2px 0">x'+it.qty+'</td>'
            +'<td style="padding:2px 6px">'+it.name+'</td>'
            +'<td class="r" style="padding:2px 0">'+fmt(it.price*it.qty)+'</td>'
            +'</tr>';
        });
        html+='</table>';
        html+='<div style="text-align:right;font-weight:bold;border-top:1px solid #eee;padding-top:2px">Total: '+fmt(s.total)+'</div>';
        html+='</div>';
      });
      html+='<hr/><div style="text-align:center;font-size:11px;color:#666">Powered by Arroyo POS</div>';
      html+='<br/><div style="text-align:center"><button onclick="window.print()" style="padding:10px 24px;font-size:14px;cursor:pointer">Print</button></div>';
      html+='</body></html>';
      const win=window.open('','_blank','width=420,height=700');
      if(win){win.document.write(html);win.document.close();}
      else{toast('Allow popups to print report');}
    };
    printRow.appendChild(closeB);printRow.appendChild(printB);body.appendChild(printRow);
  }

    modal.appendChild(body);
  ov.appendChild(modal);
  app.appendChild(ov);
}

// ── CLOUD BANNER (shown when back online with pending items, or session expired) ──
let _bannerDismissed=false;
function renderCloudBanner(app){
  const pending=queueCount();
  const offline=!navigator.onLine;
  // Only show banner when online and there are pending items to push
  if(offline||pending===0||_bannerDismissed||!CLOUD.token||!CLOUD.bizId)return;
  const banner=document.createElement('div');banner.className='cloud-banner save';
  const ico=document.createTextNode('☁️ ');
  const lbl=document.createElement('span');lbl.textContent=pending+' offline item'+(pending>1?'s':'')+' — tap to save to cloud';
  const cls=document.createElement('button');cls.className='cloud-banner-close';cls.innerHTML='&times;';
  cls.onclick=function(e){e.stopPropagation();_bannerDismissed=true;banner.remove();};
  banner.onclick=async function(){
    banner.className='cloud-banner saving';lbl.textContent='Saving to cloud…';
    const authed=await ensureAuth();
    if(!authed){lbl.textContent='Session expired — sign in again';setTimeout(()=>banner.remove(),2500);return;}
    const n=await flushSyncQueue(null);
    _bannerDismissed=true;
    toast('Saved '+pending+' item'+(pending>1?'s':'')+' to cloud ✓');
    banner.remove();
    await loadCloudData(true);render();
  };
  banner.appendChild(ico);banner.appendChild(lbl);banner.appendChild(cls);
  app.appendChild(banner);
}

// ── PROACTIVE TOKEN REFRESH — schedule refresh before JWT expiry ──
function scheduleTokenRefresh(){
  if(!CLOUD.token)return;
  try{
    // Parse JWT exp claim (no library needed — it's base64url)
    const payload=JSON.parse(atob(CLOUD.token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    if(!payload.exp)return;
    const msUntilExpiry=(payload.exp*1000)-Date.now();
    // Refresh 5 minutes before expiry (or immediately if already within 5 min)
    const refreshIn=Math.max(0,msUntilExpiry-5*60*1000);
    console.log('[Arroyo] Token refresh scheduled in '+(refreshIn/1000/60).toFixed(1)+'m');
    setTimeout(async function(){
      if(!CLOUD.token)return;
      const ok=await refreshSession();
      if(ok){
        console.log('[Arroyo] Proactive token refresh succeeded');
        scheduleTokenRefresh(); // schedule next refresh
      } else {
        // Refresh failed — show re-auth when user next tries an action
        // Don't interrupt them silently — they'll get the re-auth modal on next sync/action
        console.warn('[Arroyo] Proactive token refresh failed — will re-auth on next action');
        // Show a subtle notification dot change
        const dot=document.getElementById('netDot');
        const lbl=document.getElementById('netLbl');
        if(dot){dot.style.background='var(--wt)';}
        if(lbl){lbl.textContent='SESSION';}
      }
    },refreshIn);
  }catch(e){console.warn('[Arroyo] scheduleTokenRefresh error:',e);}
}

// ── ONLINE / OFFLINE EVENT HANDLERS ──
window.addEventListener('offline',function(){
  const dot=document.getElementById('netDot');
  const lbl=document.getElementById('netLbl');
  if(dot){dot.className='net-dot offline';}
  if(lbl){lbl.textContent='OFFLINE';}
  toast('You\'re offline — sales save locally ✓');
});

window.addEventListener('online',async function(){
  const dot=document.getElementById('netDot');
  const lbl=document.getElementById('netLbl');
  if(dot){dot.className='net-dot online';}
  if(lbl){lbl.textContent='';}

  if(!CLOUD.token||!CLOUD.bizId)return;

  const pending=queueCount();
  if(pending>0){
    // Reset banner dismissed state so the banner shows again
    _bannerDismissed=false;
    render(); // re-render shows the cloud banner
  } else {
    // No pending items — just silently pull latest from cloud
    toast('Back online — syncing…');
    const authed=await ensureAuth();
    if(authed){await loadCloudData(true);render();toast('Synced ✓');}
  }
  /* Ingredients and recipe lines written while offline sit outside the sales
     queue, so they need their own nudge here or they would wait until the
     next manual full sync. */
  const ps=await retryPrepSync();
  if(ps&&(ps.ings||ps.recipes)){render();toast('Synced '+(ps.ings+ps.recipes)+' prep item(s)');}
  await retryShiftSync();
});

/* Closed shifts that never reached the cloud are pushed again here. Kept
   separate from the sales queue so a missing `shifts` table can never block
   sales from syncing. */
async function retryShiftSync(){
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return 0;
  const pend=(S.shiftLog||[]).filter(function(r){return !r.cloudSynced;});
  let n=0;
  for(let i=0;i<pend.length;i++){
    const ok=await pushShiftToCloud(pend[i]);
    if(ok)n++;
  }
  if(n)render();
  return n;
}

/* Slow safety net: anything still outstanding is retried in the background
   so a recipe never silently stays local. Quiet unless it clears something. */
setInterval(async function(){
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return;
  if(prepPendingCount()>0){
    const ps=await retryPrepSync();
    if(ps&&(ps.ings||ps.recipes))render();
  }
  if((S.shiftLog||[]).some(function(r){return !r.cloudSynced;}))await retryShiftSync();
},60000);

// ── BARCODE SCANNER INPUT ────────────────────────────────────
// USB / Bluetooth scanners act as keyboards: they type the code
// very fast then send Enter. We buffer keystrokes and resolve on
// Enter. Typing into a form field is never intercepted.
let _scanBuf='',_scanLast=0;
function findByBarcode(code){
  const c=String(code||'').trim().toLowerCase();
  if(!c)return null;
  return S.prods.find(function(p){return (p.barcode||'').trim().toLowerCase()===c;})||null;
}
function scanAddToCart(p){
  if(p.stock!==999&&p.stock<=0){toast(p.name+' is out of stock');return;}
  if(p.variants&&p.variants.length>0){openModal({type:'variantPick',prod:p});return;}
  const effPrice=(p.salePct>0)?+(p.price*(1-p.salePct/100)).toFixed(2):p.price;
  const ex=S.cart.find(function(i){return i.id===p.id&&!i.variantLabel;});
  if(ex)ex.qty++;
  else S.cart.push({id:p.id,name:p.name,price:effPrice,qty:1,note:'',cat:p.cat||'Uncategorised',origPrice:p.salePct>0?p.price:null,salePct:p.salePct||0});
  render();toast('\u2713 '+p.name+' \u00b7 scanned');
}
document.addEventListener('keydown',function(e){
  // Never hijack real typing
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable))return;
  // Only on the POS product grid, with no modal open
  if(S.screen!=='pos'||S.cartOpen||S.modal)return;
  const now=Date.now();
  if(now-_scanLast>300)_scanBuf='';
  _scanLast=now;
  if(e.key==='Enter'){
    const code=_scanBuf;_scanBuf='';
    if(code.length<3)return;
    const p=findByBarcode(code);
    if(p){e.preventDefault();scanAddToCart(p);}
    else toast('No product with barcode '+code);
    return;
  }
  if(e.key.length===1)_scanBuf+=e.key;
});
// ── END BARCODE SCANNER ──────────────────────────────────────

load();render();
// Auto-sync from cloud on every app open if signed in
(async function(){
  if(CLOUD.token&&CLOUD.bizId){
    // Proactively refresh token on every app open, then schedule future refreshes
    if(CLOUD.refresh){
      await refreshSession();
    } else {
      await ensureAuth();
    }
    scheduleTokenRefresh();
    // Flush any offline queue first before pulling from cloud
    const pending=queueCount();
    if(pending>0){
      console.log('[Arroyo] Auto-flushing '+pending+' offline item(s) on app open...');
      await flushSyncQueue(null);
      toast('Synced '+pending+' offline item'+(pending>1?'s':'')+' ✓');
    }
    await loadCloudData(true);
    render();
  }
})();
/* Demo build: no service worker. */
</script>

<script>
/* ==================================================================== *
 * WAITING QUEUE — cafes, restaurants, bakeries
 * Each sale takes the next number for today. Staff mark it ready when the
 * order is made; the wall display picks that up and calls the number.
 * Numbers are allocated by a server function so two tills cannot collide,
 * with a local fallback so the till still works offline.
 * ==================================================================== */
(function(){
  'use strict';
  var Q=(typeof QUEUE_CFG!=='undefined')?QUEUE_CFG:{enabled:false};
  if(!Q.enabled)return;

  function hdrs(){
    if(typeof cloudHeaders==='function')return cloudHeaders();
    return {'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
  }
  function online(){return typeof CLOUD!=='undefined'&&CLOUD&&CLOUD.token&&CLOUD.bizId&&navigator.onLine;}
  function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function label(n){return (Q.prefix?Q.prefix+'-':'')+n;}
  window.__qzLabel=label;

  /* ---- number allocation ------------------------------------------ *
   * Server-side max+1 for the day. Falls back to the highest number this
   * device has seen today, so an offline till keeps counting; the numbers
   * reconcile on the next successful allocation. */
  async function nextNo(){
    if(online()){
      try{
        var r=await fetch(SUPA_URL+'/rest/v1/rpc/next_queue_no',
          {method:'POST',headers:hdrs(),body:JSON.stringify({b:CLOUD.bizId})});
        if(r.ok){
          var n=await r.json();
          n=parseInt(n,10);
          if(n>0)return n;
        }
      }catch(e){}
    }
    return localNext();
  }
  function localNext(){
    var d=today(), mx=0;
    (S.sales||[]).forEach(function(s){
      if(s.queueDay===d&&s.queueNo>mx)mx=s.queueNo;
    });
    return mx+1;
  }
  window.__qzNext=nextNo;

  /* ---- staff view ------------------------------------------------- */
  var ov=document.getElementById('qz-ov'), sheet=document.getElementById('qz-sheet');
  var fab=document.getElementById('qz-fab');
  ov.onclick=function(e){if(e.target===ov)close();};
  function close(){ov.classList.remove('on');}
  window.__qzClose=close;
  window.__qzOpen=function(){ov.classList.add('on');paint();};

  function live(){
    var d=today();
    return (S.sales||[]).filter(function(s){
      return s.queueDay===d&&s.queueNo&&!s.voided&&
             (s.queueStatus==='waiting'||s.queueStatus==='ready');
    }).sort(function(a,b){return a.queueNo-b.queueNo;});
  }

  function badge(){
    var n=live().length;
    document.getElementById('qz-n').textContent=n;
    fab.classList.toggle('on',n>0);
  }
  window.__qzBadge=badge;

  function paint(){
    var rows=live();
    var wait=rows.filter(function(s){return s.queueStatus==='waiting';});
    var rdy=rows.filter(function(s){return s.queueStatus==='ready';});
    var head='<div class="qz-hd"><h3>&#128363; Waiting queue</h3>'+
             '<button class="qz-x" onclick="__qzClose()">&times;</button></div>'+
             '<div class="qz-sub">'+rows.length+' open \u00b7 numbers reset each day</div>';
    if(!rows.length){
      sheet.innerHTML=head+'<div class="qz-empty">No open orders.<br>Numbers are given out as you ring up sales.</div>';
      return;
    }
    var body='';
    if(wait.length){
      body+='<div class="qz-grp">Preparing</div>'+wait.map(function(s){
        return '<div class="qz-row"><div class="qz-no">'+esc(label(s.queueNo))+'</div>'+
          '<div class="qz-meta"><div class="qz-t">'+esc(itemLine(s))+'</div>'+
          '<div class="qz-d">'+esc(timeOf(s))+(s.cashier?' \u00b7 '+esc(s.cashier):'')+'</div></div>'+
          '<button class="qz-act qz-ready" onclick="__qzSet(\''+s.id+'\',\'ready\')">Ready</button></div>';
      }).join('');
    }
    if(rdy.length){
      body+='<div class="qz-grp">Ready \u2014 called on the screen</div>'+rdy.map(function(s){
        return '<div class="qz-row"><div class="qz-no rd">'+esc(label(s.queueNo))+'</div>'+
          '<div class="qz-meta"><div class="qz-t">'+esc(itemLine(s))+'</div>'+
          '<div class="qz-d">'+esc(timeOf(s))+'</div></div>'+
          '<button class="qz-act qz-done" onclick="__qzSet(\''+s.id+'\',\'served\')">Collected</button></div>';
      }).join('');
    }
    sheet.innerHTML=head+body+
      '<div class="qz-note">"Ready" puts the number on the queue screen and calls it out loud. '+
      '"Collected" clears it.</div>';
  }

  function itemLine(s){
    var it=Array.isArray(s.items)?s.items:[];
    if(!it.length)return 'Sale '+(s.id||'');
    return it.map(function(i){return i.name+(i.qty>1?' \u00d7'+i.qty:'');}).join(', ');
  }
  function timeOf(s){
    try{return new Date(s.date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}
    catch(e){return '';}
  }

  window.__qzSet=async function(id,status){
    var s=(S.sales||[]).find(function(x){return x.id===id;});
    if(!s)return;
    s.queueStatus=status;
    if(typeof save==='function')save();
    badge(); paint();
    if(typeof toast==='function'){
      toast(status==='ready'?label(s.queueNo)+' called':label(s.queueNo)+' collected');
    }
    if(online()){
      try{
        await fetch(SUPA_URL+'/rest/v1/sales?txn_id=eq.'+encodeURIComponent(id)+'&biz_id=eq.'+CLOUD.bizId,
          {method:'PATCH',headers:hdrs(),body:JSON.stringify({queue_status:status})});
      }catch(e){/* the offline queue picks this up on the next sync */}
    }
  };

  /* Keep the badge current without touching the POS render loop. */
  setTimeout(badge,1200);
  setInterval(badge,15000);
})();
</script>

<script>
/* ==================================================================== *
 * In-app dialogs. Replaces window.alert / confirm / prompt, which the
 * browser renders as an OS box titled with the GitHub Pages hostname —
 * it looks like a security warning rather than part of the app.
 *
 * alert() is overridden directly since nothing depends on its return.
 * confirm()/prompt() return synchronously, so they cannot be overridden
 * safely; call sites use uiConfirm/uiPrompt with a callback instead.
 * ==================================================================== */
(function(){
  'use strict';
  var ov=document.getElementById('uid-ov'), box=document.getElementById('uid-box');
  var ic=document.getElementById('uid-ic'), ttl=document.getElementById('uid-t');
  var msg=document.getElementById('uid-m'), inWrap=document.getElementById('uid-in-wrap');
  var input=document.getElementById('uid-input'), err=document.getElementById('uid-err');
  var bNo=document.getElementById('uid-no'), bYes=document.getElementById('uid-yes');
  var queue=[], active=null, lastFocus=null;

  var ICONS={info:'i',warn:'!',dang:'!',ok:'\u2713'};

  function splitTitle(text){
    var t=String(text==null?'':text);
    var nl=t.indexOf('\n');
    if(nl>0&&nl<=64)return{title:t.slice(0,nl).trim(),body:t.slice(nl+1).trim()};
    if(t.length<=52)return{title:t.trim(),body:''};
    var dot=t.search(/[.?!]\s/);
    if(dot>0&&dot<=64)return{title:t.slice(0,dot+1).trim(),body:t.slice(dot+2).trim()};
    return{title:'',body:t.trim()};
  }

  function show(cfg){
    if(active){queue.push(cfg);return;}
    active=cfg;
    lastFocus=document.activeElement;
    var st=splitTitle(cfg.text);
    var tone=cfg.tone||'info';
    ic.className=tone; ic.textContent=ICONS[tone]||'i';
    ttl.textContent=cfg.title||st.title||(cfg.kind==='confirm'?'Please confirm':'Notice');
    msg.textContent=cfg.title?cfg.text:(st.body||st.title);
    msg.style.display=msg.textContent?'block':'none';
    err.classList.remove('on'); err.textContent='';
    if(cfg.kind==='prompt'){
      inWrap.classList.add('on');
      input.type=cfg.password?'password':'text';
      input.value=cfg.value||'';
      input.placeholder=cfg.placeholder||'';
    } else inWrap.classList.remove('on');
    bNo.style.display=(cfg.kind==='alert')?'none':'';
    bNo.textContent=cfg.cancelText||'Cancel';
    bYes.textContent=cfg.okText||(cfg.kind==='alert'?'OK':'Confirm');
    bYes.className=(tone==='dang')?'uid-dang':'uid-pri';
    ov.classList.add('on');
    setTimeout(function(){ (cfg.kind==='prompt'?input:bYes).focus(); },40);
  }

  function done(result){
    if(!active)return;
    var cb=active.cb; active=null;
    ov.classList.remove('on');
    try{ if(lastFocus&&lastFocus.focus)lastFocus.focus(); }catch(e){}
    if(cb)try{ cb(result); }catch(e){ console.error(e); }
    if(queue.length)setTimeout(function(){ show(queue.shift()); },120);
  }

  bYes.onclick=function(){
    if(active&&active.kind==='prompt'){
      var v=input.value;
      if(active.required&&!String(v).trim()){
        err.textContent=active.requiredMsg||'This cannot be empty';
        err.classList.add('on'); input.focus(); return;
      }
      done(v);
      return;
    }
    done(active&&active.kind==='alert'?undefined:true);
  };
  bNo.onclick=function(){ done(active&&active.kind==='prompt'?null:false); };
  ov.addEventListener('click',function(e){ if(e.target===ov&&active&&active.kind!=='alert')bNo.onclick(); });
  document.addEventListener('keydown',function(e){
    if(!active)return;
    if(e.key==='Escape'){ e.preventDefault(); active.kind==='alert'?done(undefined):bNo.onclick(); }
    else if(e.key==='Enter'&&document.activeElement!==bNo){ e.preventDefault(); bYes.onclick(); }
  });

  window.uiAlert=function(text,opts){
    opts=opts||{}; show({kind:'alert',text:text,tone:opts.tone||'info',title:opts.title,
      okText:opts.okText,cb:opts.cb});
  };
  window.uiConfirm=function(text,cb,opts){
    opts=opts||{}; show({kind:'confirm',text:text,tone:opts.tone||'warn',title:opts.title,
      okText:opts.okText,cancelText:opts.cancelText,cb:cb});
  };
  window.uiPrompt=function(text,cb,opts){
    opts=opts||{}; show({kind:'prompt',text:text,tone:opts.tone||'info',title:opts.title,
      okText:opts.okText||'Continue',password:opts.password,placeholder:opts.placeholder,
      value:opts.value,required:opts.required,requiredMsg:opts.requiredMsg,cb:cb});
  };

  /* Safe to override: no caller reads a return value from alert. */
  window.alert=function(text){
    var t=String(text==null?'':text);
    var tone=/fail|error|cannot|invalid|denied|wrong|expired|not\s/i.test(t)?'warn':'info';
    if(/deleted|removed|wiped|permanent/i.test(t))tone='dang';
    if(/success|saved|added|updated|complete|\u2705/i.test(t))tone='ok';
    window.uiAlert(t,{tone:tone});
  };
})();
</script>

</body>
</html>
