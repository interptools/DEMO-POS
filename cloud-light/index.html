function applyTheme(hex){
  if(!hex||hex.length!==7)return;
  try{
    var R=parseInt(hex.slice(1,3),16),G=parseInt(hex.slice(3,5),16),B=parseInt(hex.slice(5,7),16);
    if(isNaN(R)||isNaN(G)||isNaN(B))return;
    /* CARBON COPY.
       Earlier builds turned the client's colour into the page background, which
       is why the fine print went invisible. It is now purely an ink: the manila
       paper and black keylines are fixed in the stylesheet and never touched
       here. The only thing we must guarantee is that the accent is legible in
       BOTH the roles it plays — a fill under white text (the charge bar, the
       primary buttons) and text on white (prices, totals). Walking it dark
       until it clears 5.2:1 against white satisfies both, and leaves headroom
       for the 94%-light tint used behind brand chips. */
    var mx=Math.max(R,G,B)/255, mn=Math.min(R,G,B)/255, d=mx-mn;
    var H=0, S=0, Lc=(mx+mn)/2;
    if(d){
      S=Lc>0.5?d/(2-mx-mn):d/(mx+mn);
      var rr=R/255,gg=G/255,bb=B/255;
      H=(mx===rr)?((gg-bb)/d+(gg<bb?6:0)):(mx===gg)?((bb-rr)/d+2):((rr-gg)/d+4);
      H/=6;
    }
    var hsl=function(h,sa,li){
      sa=Math.max(0,Math.min(1,sa)); li=Math.max(0,Math.min(1,li));
      var f=function(n){
        var k=(n+h*12)%12;
        return li-sa*Math.min(li,1-li)*Math.max(-1,Math.min(Math.min(k-3,9-k),1));
      };
      var to=function(v){return Math.round(v*255).toString(16).padStart(2,'0');};
      return '#'+to(f(0))+to(f(8))+to(f(4));
    };
    var lin=function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};
    var onWhite=function(c){
      var v=[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
      return 1.05/((0.2126*lin(v[0])+0.7152*lin(v[1])+0.0722*lin(v[2]))+0.05);
    };
    /* A near-grey brand colour has a meaningless hue (#111110 computes as
       yellow), so below this threshold we use the carbon-blue of a ballpoint
       duplicate instead of inventing a tint. */
    var ac,ac2;
    if(S>=0.08){
      var acS=Math.max(S,0.38),acL=Math.min(0.42,Math.max(0.22,Lc));
      ac=hsl(H,acS,acL);
      var g=0;
      while(onWhite(ac)<5.2&&acL>0.13&&g++<48){ acL-=0.015; ac=hsl(H,acS,acL); }
      ac2=hsl(H,Math.min(Math.max(S,0.24),0.60),0.94);
    }else{
      ac='#1b3a8c'; ac2='#e4e8f4';
    }
    var root=document.documentElement;
    root.style.setProperty('--ac',ac);
    root.style.setProperty('--ac2',ac2);
    var mt=document.querySelector('meta[name="theme-color"]');
    if(mt)mt.setAttribute('content','#edebe3');
  }catch(e){}
}


function fmt(n){return CUR+(+n).toFixed(2);}

/* Escapes text before it goes anywhere near innerHTML. There was already an
   esc() in this file, but it lives inside the queue IIFE further down and was
   never reachable from the render functions up here — product names, cashier
   names, expense descriptions and category labels are all operator-supplied
   and were being concatenated into markup unescaped. A product named
   Tom & Jerry's rendered wrong; anything with a tag in it rendered worse. */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function toast(msg){
  const t=document.createElement('div');
  t.className='toast';t.textContent=msg;
  const tc=document.getElementById('toasts');
  if(tc){tc.appendChild(t);setTimeout(()=>t.remove(),2200);}
}

function lowStockItems(){return S.prods.filter(p=>p.stock!==999&&p.stock>0&&p.stock<=5);}
function outStockItems(){return S.prods.filter(p=>p.stock!==999&&p.stock<=0);}

// Roll parent stock up from variants so cards/alerts/scanner stay accurate
function syncParentStock(p){
  if(!p||!p.variants||!p.variants.length)return;
  if(p.variants.some(function(v){return v.stock===999;})){p.stock=999;return;}
  p.stock=p.variants.reduce(function(a,v){return a+(parseInt(v.stock)||0);},0);
}
// Apply a stock movement for one line item.
// delta < 0 = sale, delta > 0 = void/restore.
// Accepts cart items (matched by id) and tx.items (matched by name).
function applyStockDelta(it,delta){
  const p=S.prods.find(function(x){return it.id!==undefined?x.id===it.id:x.name===it.name;});
  if(!p)return;
  if(it.variantLabel&&p.variants&&p.variants.length){
    const v=p.variants.find(function(x){return x.label===it.variantLabel;});
    if(v){
      if(v.stock!==999)v.stock=Math.max(0,(parseInt(v.stock)||0)+delta);
      syncParentStock(p);
      return;
    }
    // Variant was deleted since the sale — fall back to parent stock
  }
  if(p.stock!==999)p.stock=Math.max(0,p.stock+delta);
}

function exportCSV(sales){
  const rows=[['TXN ID','Date','Time','Cashier','Items','Total','Method','Ref','Voided']];
  sales.forEach(s=>{
    rows.push([s.id,new Date(s.date).toLocaleDateString('en-PH'),new Date(s.date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),
      s.cashier||'',s.items.map(i=>i.name+(i.variantLabel?' ('+i.variantLabel+')':'')+' x'+i.qty).join('; '),
      s.total.toFixed(2),s.method,s.ref||'',s.voided?'YES':'NO']);
  });
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='arroyo-pos-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  URL.revokeObjectURL(url);toast('CSV exported!');
}

function sub(){return S.cart.reduce((s,i)=>s+i.price*i.qty,0);}
function damt(){const s=sub();const d=Math.max(0,S.disc||0);return S.discType==='%'?s*Math.min(d,100)/100:Math.min(d,s);}
function tamt(){return 0;}
function tot(){return sub()-damt()+tamt();}
function txId(){
  // Timestamp (base36) + 4 random chars = globally unique across devices
  const ts=Date.now().toString(36).toUpperCase();
  const rnd=Math.random().toString(36).substr(2,4).toUpperCase();
  return'TXN-'+ts+'-'+rnd;
}
function cc(){return S.cart.reduce((s,i)=>s+i.qty,0);}

function initBiz(id){
  const b=BT.find(x=>x.id===id);
  S.biz=id;S.bizName=b.label;
  S.prods=JSON.parse(JSON.stringify(DP[id]||[]));
  const cs=[...new Set(S.prods.map(p=>p.cat))];

}

function addToCart(p){
  const ex=S.cart.find(i=>i.id===p.id);
  // cat travels with the line so the sale records it at checkout and the
  // category report stays correct even if the product is later renamed.
  if(ex)ex.qty++;else S.cart.push({id:p.id,name:p.name,price:p.price,qty:1,cat:p.cat||'Uncategorised'});
  render();toast(p.name+' added');
}

function chgQty(id,delta){
  const it=S.cart.find(i=>i.id===id);
  if(!it)return;
  it.qty+=delta;
  if(it.qty<=0)S.cart=S.cart.filter(i=>i.id!==id);
  render();
}

function receiptStr(method,id,refNum){
  const now=new Date(),w=28;
  const lp=(s,n)=>String(s).length>=n?String(s).slice(0,n):String(s)+' '.repeat(n-String(s).length);
  const rp=(s,n)=>String(s).length>=n?String(s).slice(0,n):' '.repeat(n-String(s).length)+String(s);
  const line='-'.repeat(w);
  var rows;
  if(typeof QUEUE_CFG!=='undefined'&&QUEUE_CFG.enabled&&S.pendingQueueNo){
    var qlab=(typeof __qzLabel==='function')?__qzLabel(S.pendingQueueNo):String(S.pendingQueueNo);
    var ctr=function(t){var pad=Math.max(0,Math.floor((w-String(t).length)/2));return ' '.repeat(pad)+t;};
    rows=[ctr(S.bizName),line,
          ctr('YOUR NUMBER'),
          ctr('*  '+qlab+'  *'),
          ctr('Please wait to be called'),
          line,'Date: '+now.toLocaleString(),'TXN:  '+id,line];
  } else {
    rows=[lp(S.bizName,w),line,'Date: '+now.toLocaleString(),'TXN:  '+id,line];
  }
  S.cart.forEach(i=>{const r=fmt(i.price*i.qty);rows.push(lp(i.name+' x'+i.qty,w-r.length)+r);});
  rows.push(line);
  const ar=(l,r)=>rows.push(lp(l,w-r.length)+r);
  ar('Subtotal:',fmt(sub()));
  if(S.disc>0)ar('Discount:','-'+fmt(damt()));
  // VAT already included in price - no separate VAT line
  rows.push(line);
  ar('TOTAL:',fmt(tot()));
  rows.push('Payment: '+method);
  if(refNum)rows.push('Ref No:  '+refNum);
  if(method==='Cash'&&S.cashTendered>=tot()){
    ar('Cash:',fmt(S.cashTendered));
    ar('Change:',fmt(S.cashTendered-tot()));
  }
  rows.push(line);
  rows.push(rp('Powered by Arroyo POS',w));
  return rows.join('\n');
}

// ── CODE 128 BARCODE GENERATOR ──────────────────────────────
// Generates a pure SVG Code 128B barcode — no external library needed
function code128SVG(text,opts){
  opts=opts||{};
  const height=opts.height||60;
  const quiet=opts.quiet||10;

  // Code 128B encoding table (value → bar pattern)
  const C128={
    ' ':11011001100,'!':11001101100,'"':11001100110,'#':10010011000,
    '$':10010001100,'%':10001001100,'&':10011001000,"'":10011000100,
    '(':10001100100,')':11001001000,'*':11001000100,'+':11000100100,
    ',':10110011100,'-':10011011100,'.':10011001110,'/':10111001100,
    '0':10011101100,'1':10011100110,'2':11001110010,'3':11001011100,
    '4':11001001110,'5':11011100100,'6':11001110100,'7':11101101110,
    '8':11101001100,'9':11100101100,':':11100100110,';':11101100100,
    '<':11100110100,'=':11100110010,'>':11011011000,'?':11011000110,
    '@':11000110110,'A':10100011000,'B':10001011000,'C':10001000110,
    'D':10110001000,'E':10001101000,'F':10001100010,'G':11010001000,
    'H':11000101000,'I':11000100010,'J':10110111000,'K':10110001110,
    'L':10001101110,'M':10111011000,'N':10111000110,'O':10001110110,
    'P':11101110110,'Q':11010001110,'R':11000010010,'S':11001010000,
    'T':11110101000,'U':11110100010,'V':11110010010,'W':11011110100,
    'X':11011110010,'Y':11110110100,'Z':11010111000,
    '[':11010100010,'\\':11010010000,']':11011010000,'^':11011001010,
    '_':10000110100,'`':10000110010,'a':10011010000,'b':10011001010,
    'c':10000101100,'d':10000100110,'e':10110010000,'f':10110000100,
    'g':10011000010,'h':10000011010,'i':10000010110,'j':10110100000,
    'k':10110010100,'l':10110000010,'m':11000010100,'n':11001010100,
    'o':10111100010,'p':11001001010,'q':10010011110,'r':10011110010,
    's':10011110100,'t':10111001110,'u':10111100100,'v':10001111010,
    'w':10011011110,'x':10001111100,'y':10111011110,'z':10111101110,
    '{':11110010100,'|':11110010010,'}':11011110100,'~':11011101000
  };

  // Start Code B = pattern 11010010000, value=104
  const START_B=11010010000;
  const STOP=11000111010;
  const startVal=104;

  // Build bar pattern string
  let patterns=[START_B.toString()];
  let checksum=startVal;
  const chars=[...text];
  chars.forEach(function(ch,i){
    const pat=C128[ch];
    if(!pat)return;
    patterns.push(pat.toString());
    // checksum: startVal + sum(charVal * position)
    // Code128B: space=0, !..~ = 1..94
    const v=ch.charCodeAt(0)-32; // space=0, A=33, etc.
    checksum+=v*(i+1);
  });

  // Check character (value mod 103)
  const checkVal=checksum%103;
  // Find the character for checkVal in Code128B
  // checkVal maps to ASCII: checkVal+32 for B set
  const checkChar=String.fromCharCode(checkVal+32);
  const checkPat=C128[checkChar];
  if(checkPat)patterns.push(checkPat.toString());

  patterns.push(STOP.toString());

  // Convert patterns to bar widths
  // Each digit in pattern = 1 unit wide bar or space
  // 1=bar, 0=space (alternating, starting with bar)
  let bars=[];
  patterns.forEach(function(p){
    const digits=p.split('');
    digits.forEach(function(d){bars.push(parseInt(d));});
  });

  // Build SVG
  const unitW=opts.unitW||2; // px per unit — 2px good for thermal
  let x=quiet;
  let rects='';
  let isBar=true;
  bars.forEach(function(w){
    if(isBar&&w>0){
      rects+='<rect x="'+x+'" y="0" width="'+(w*unitW)+'" height="'+height+'" fill="#000"/>';
    }
    x+=w*unitW;
    isBar=!isBar;
  });
  const totalW=x+quiet;

  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+totalW+'" height="'+(height+20)+'" viewBox="0 0 '+totalW+' '+(height+20)+'">'
    +'<rect width="'+totalW+'" height="'+(height+20)+'" fill="#fff"/>'
    +rects
    +'<text x="'+(totalW/2)+'" y="'+(height+14)+'" text-anchor="middle" font-family="monospace" font-size="9" fill="#000">'+text+'</text>'
    +'</svg>';
}

/* ===== RENDER ===== */
function render(){
  const app=document.getElementById('app');
  const tc=document.getElementById('toasts');
  app.innerHTML='';
  if(tc)app.appendChild(tc);

  if(!S.installed){S.installed=true;save();}/*demo:no install gate*/

  // Cloud auth gate — show login if not signed in
  if(!CLOUD.token){renderCloudAuth(app);if(S.modal)renderModal(app);return;}

  if(S.screen==='biz'){renderBiz(app);return;}
  if(S.screen==='wizard'){renderWizard(app);return;}

  // Cashier gate
  if(S.cashiers.length>0&&!S.activeCashier&&S.screen!=='admin'){
    renderCashierLogin(app);if(S.modal)renderModal(app);return;
  }

  renderTopNav(app);
  renderCloudBanner(app);

  const scr=document.createElement('div');
  scr.className='screen';

  if(S.screen==='pos'){
    if(S.cartOpen)renderCart(scr);
    else renderPOS(scr);
  }
  else if(S.screen==='inv'){S.stockLocked?renderStockLock(scr):renderInv(scr);}
  else if(S.screen==='prep')renderPrep(scr);
  else if(S.screen==='hist')renderHist(scr);
  else if(S.screen==='exp')renderExp(scr);
  else if(S.screen==='att'){renderAtt(scr);}
  else if(S.screen==='admin'){S.locked?renderLock(scr,{showThemeReset:true}):renderAdmin(scr);}
  else if(S.screen==='about')renderAbout(scr);

  app.appendChild(scr);
  if(S.modal)renderModal(app);
}

          save();

/* ==================================================================== *
 * CASH DRAWER — FLOAT, SHIFT RECONCILIATION, SHORT / OVER
 *
 * A shift opens with a counted float (the "cash on hand" the cashier starts
 * with) and closes with a second count. What the drawer should hold is
 * derived, never typed:
 *
 *   expected = opening float + cash sales - cash paid out
 *
 * Only Cash sales move the drawer: GCash and Credit take no notes, so
 * folding them in would have made every shift look short by the value of
 * its cashless trade. Voided sales are excluded for the same reason.
 * ==================================================================== */

// Sales taken during a shift, split by tender.
function shiftSalesBreakdown(sh){
  const out={cash:0,gcash:0,credit:0,other:0,total:0,count:0,voided:0};
  if(!sh)return out;
  const from=new Date(sh.startedAt).getTime();
  const to=sh.endedAt?new Date(sh.endedAt).getTime():Date.now();
  (S.sales||[]).forEach(function(s){
    const t=new Date(s.date).getTime();
    if(isNaN(t)||t<from||t>to)return;
    if(s.voided){out.voided++;return;}
    const amt=+s.total||0;
    out.count++;out.total+=amt;
    const m=s.method||'Cash';
    if(m==='Cash')out.cash+=amt;
    else if(m==='GCash')out.gcash+=amt;
    else if(m==='Utang')out.credit+=amt;
    else out.other+=amt;
  });
  return out;
}

// Expenses recorded during a shift — the default assumption is drawer cash.
function shiftPaidOut(sh){
  if(!sh)return 0;
  const from=new Date(sh.startedAt).getTime();
  const to=sh.endedAt?new Date(sh.endedAt).getTime():Date.now();
  return (S.expenses||[]).filter(function(e){
    const t=new Date(e.date).getTime();
    return !isNaN(t)&&t>=from&&t<=to;
  }).reduce(function(a,e){return a+(+e.amount||0);},0);
}

function expectedDrawer(sh,paidOut){
  if(!sh)return 0;
  const b=shiftSalesBreakdown(sh);
  const po=(paidOut===undefined||paidOut===null)?shiftPaidOut(sh):(+paidOut||0);
  return (+sh.openingFloat||0)+b.cash-po;
}

/* Pushes a closed shift up if the table exists. Written defensively: an
   install whose Supabase has no `shifts` table simply keeps the record on
   the device instead of throwing an error at the cashier. */
async function pushShiftToCloud(sh){
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return false;
  const b=shiftSalesBreakdown(sh);
  const full={biz_id:CLOUD.bizId,cashier:sh.cashier||'',employee_id:sh.supaId||null,
    started_at:sh.startedAt,ended_at:sh.endedAt,
    opening_float:+sh.openingFloat||0,cash_sales:b.cash,paid_out:+sh.paidOut||0,
    expected_cash:+sh.expected||0,counted_cash:+sh.countedCash||0,
    variance:+sh.variance||0,note:sh.note||''};
  const lean={biz_id:CLOUD.bizId,cashier:sh.cashier||'',started_at:sh.startedAt,
    ended_at:sh.endedAt,opening_float:+sh.openingFloat||0,
    counted_cash:+sh.countedCash||0,variance:+sh.variance||0};
  const last={status:0,msg:''};
  try{
    let a=await prepAttempt('POST','/rest/v1/shifts',full,last);
    if(!a.ok)a=await prepAttempt('POST','/rest/v1/shifts',lean,last);
    if(!a.ok){sh.cloudSynced=false;save();return false;}
    sh.cloudSynced=true;save();
    return true;
  }catch(e){sh.cloudSynced=false;save();return false;}
}

/* Short / over, phrased the way a cashier would say it out loud. `rec` is
   optional; passing a shift record lets an abandoned drawer report itself as
   uncounted instead of showing a variance of zero as "Balanced", which would
   have read as a clean shift when in fact nobody ever counted it. */
function varianceLabel(v,rec){
  if(rec&&(rec.unreconciled||rec.countedCash===null||rec.countedCash===undefined))
    return{text:'NOT COUNTED',color:'var(--t3)',detail:'This drawer was never counted, so no short/over can be worked out.'};
  const a=Math.abs(v);
  if(a<0.005)return{text:'Balanced',color:'var(--st)',detail:'The drawer matches exactly.'};
  if(v>0)return{text:'OVER '+fmt(a),color:'var(--wt)',detail:'There is more cash in the drawer than the sales account for.'};
  return{text:'SHORT '+fmt(a),color:'var(--dt)',detail:'There is less cash in the drawer than the sales account for.'};
}

/* Sales taken on a given local day, ignoring voided ones. Used so the
   Expenses tab can show net profit for whichever day is selected rather than
   always comparing against today's takings. */
/* A day's takings split by tender. Needed because only Cash actually puts
   notes in the till — GCash and credit are revenue but never cash on hand, so
   a cash figure that included them would never reconcile against the drawer. */
function salesOnDayBreakdown(key){
  const out={cash:0,gcash:0,credit:0,other:0,total:0,count:0};
  (S.sales||[]).forEach(function(s){
    if(s.voided)return;
    if(dayKey(s.date)!==key)return;
    const amt=+s.total||0;
    out.total+=amt;out.count++;
    const m=s.method||'Cash';
    if(m==='Cash')out.cash+=amt;
    else if(m==='GCash')out.gcash+=amt;
    else if(m==='Utang')out.credit+=amt;
    else out.other+=amt;
  });
  return out;
}

function salesOnDay(key){
  return salesOnDayBreakdown(key).total;
}

function renderExp(scr){
  const hd=document.createElement('div');hd.className='panel-hd';hd.innerHTML='<h2>Expenses</h2>';
  const addb=document.createElement('button');addb.className='abtn';addb.textContent='+ Add';
  // A chosen day is passed through so the new entry lands on that date.
  addb.onclick=function(){openModal({type:'expense',date:S.expDate||''});};
  hd.appendChild(addb);scr.appendChild(hd);

  /* The stat row now follows the selection. It used to be hard-wired to
     today, so picking another period left three figures on screen that had
     nothing to do with the list underneath them. */
  const selKey=S.expDate||dayKey(new Date());
  const isToday=selKey===dayKey(new Date());
  const dayExpAmt=S.expenses.filter(function(e){return dayKey(e.date)===selKey;}).reduce(function(a,e){return a+(+e.amount||0);},0);
  const bdown=salesOnDayBreakdown(selKey);
  const daySalesAmt=bdown.total;
  const dayNet=daySalesAmt-dayExpAmt;
  /* Cash on hand is cash takings less what was paid out — GCash and credit are
     deliberately left out. They are real revenue (so they belong in Net
     profit) but no notes ever entered the till, so counting them here would
     make the figure impossible to match against a physical count. */
  const cashOnHand=bdown.cash-dayExpAmt;
  const statLbl=isToday?'Today':new Date(selKey+'T00:00:00').toLocaleDateString('en-PH',{month:'short',day:'numeric'});

  const stats=document.createElement('div');stats.className='stats';
  const statRows=[
    {l:statLbl+' sales',v:fmt(daySalesAmt),c:'color:var(--st)'},
    {l:statLbl+' expenses',v:fmt(dayExpAmt),c:'color:var(--wt)'},
    {l:'Net profit',v:fmt(dayNet),c:dayNet>=0?'color:var(--st)':'color:var(--dt)'},
    {l:'Cash sales',v:fmt(bdown.cash),c:'color:var(--st)'},
    {l:'GCash',v:fmt(bdown.gcash),c:'color:var(--pt)'},
    {l:'Cash on hand',v:fmt(cashOnHand),c:cashOnHand>=0?'color:var(--ac)':'color:var(--dt)'}
  ];
  // Credit only earns a tile on days it was actually used.
  if(bdown.credit>0)statRows.push({l:'Credit (unpaid)',v:fmt(bdown.credit),c:'color:var(--wt)'});
  if(bdown.other>0)statRows.push({l:'Other tender',v:fmt(bdown.other),c:'color:var(--t2)'});
  statRows.forEach(function(s){
    const d=document.createElement('div');d.className='stat';
    d.innerHTML='<div class="stat-l">'+esc(s.l)+'</div><div class="stat-v" style="font-size:14px;'+s.c+'">'+s.v+'</div>';
    stats.appendChild(d);
  });
  scr.appendChild(stats);

  /* Spells out the arithmetic, because "cash on hand" is otherwise easy to
     read as "everything I took today minus expenses". */
  const cohNote=document.createElement('div');
  cohNote.style.cssText='margin:0 16px 4px;font-size:11.5px;color:var(--t3);line-height:1.6';
  const excluded=[];
  if(bdown.gcash>0)excluded.push('GCash '+fmt(bdown.gcash));
  if(bdown.credit>0)excluded.push('credit '+fmt(bdown.credit));
  if(bdown.other>0)excluded.push('other tender '+fmt(bdown.other));
  cohNote.textContent='Cash on hand = cash sales '+fmt(bdown.cash)+' − expenses '+fmt(dayExpAmt)+'.'
    +(excluded.length?' Excludes '+excluded.join(' and ')+' — no notes changed hands.':'')
    +(S.openShift&&dayKey(S.openShift.startedAt)===selKey
      ? ' Add the opening float of '+fmt(S.openShift.openingFloat||0)+' for the full drawer — see Attendance.'
      : '');
  scr.appendChild(cohNote);

  const bar=document.createElement('div');bar.className='hist-bar';
  [{id:'today',lbl:'Today'},{id:'week',lbl:'This week'},{id:'month',lbl:'This month'},{id:'all',lbl:'All time'}].forEach(function(f){
    const p=document.createElement('div');p.className='hpill'+((!S.expDate&&S.expFilter===f.id)?' on':'');p.textContent=f.lbl;
    if(S.expDate)p.style.opacity='0.45';
    p.onclick=function(){S.expFilter=f.id;S.expDate='';render();};
    bar.appendChild(p);
  });
  scr.appendChild(bar);

  scr.appendChild(dayPickerRow(function(){return S.expDate;},function(v){S.expDate=v;}));

  const filtered=S.expenses.filter(function(e){
    const d=new Date(e.date);
    if(S.expDate)return dayKey(d)===S.expDate;
    if(S.expFilter==='today')return d.toDateString()===new Date().toDateString();
    if(S.expFilter==='week'){const w=new Date();w.setDate(w.getDate()-7);return d>=w;}
    if(S.expFilter==='month'){const m=new Date();m.setDate(m.getDate()-30);return d>=m;}
    return true;
  }).slice().reverse();

  // Total for everything currently listed, whatever the period.
  const periodTot=filtered.reduce(function(a,e){return a+(+e.amount||0);},0);
  const ptot=document.createElement('div');
  ptot.style.cssText='display:flex;justify-content:space-between;align-items:center;margin:12px 14px 0;padding:11px 13px;border-radius:0;background:var(--bg2);border:1px solid var(--b1)';
  ptot.innerHTML='<span style="font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.4px">Total shown</span>'
    +'<span style="font-size:16px;font-weight:800;color:var(--wt)">'+fmt(periodTot)+'</span>';
  scr.appendChild(ptot);

  /* Grouped by day with a running subtotal per day, which is what "total
     daily" needs — a flat reversed list gave no way to read a day's spend. */
  const byDay={};
  filtered.forEach(function(e){
    const k=dayKey(e.date);
    if(!byDay[k])byDay[k]=[];
    byDay[k].push(e);
  });
  const dayKeys=Object.keys(byDay).sort().reverse();

  const list=document.createElement('div');list.className='exp-list';
  if(!filtered.length){
    const em=document.createElement('div');em.className='hist-empty';
    em.textContent=S.expDate?'No expenses on this date.':'No expenses recorded.';
    list.appendChild(em);
  }

  dayKeys.forEach(function(k){
    const rows=byDay[k];
    const dTot=rows.reduce(function(a,e){return a+(+e.amount||0);},0);
    const tk=dayKey(new Date()),yk=dayKey(new Date(Date.now()-86400000));
    const lbl=k===tk?'Today':k===yk?'Yesterday'
      :new Date(k+'T00:00:00').toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'});

    const dh=document.createElement('div');
    dh.style.cssText='display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 6px';
    dh.innerHTML='<span style="font-size:13px;font-weight:800;color:var(--t1)">'+esc(lbl)+'</span>'
      +'<span style="font-size:13px;font-weight:800;color:var(--wt)">'+fmt(dTot)+'</span>';
    list.appendChild(dh);

    const dsub=document.createElement('div');
    dsub.style.cssText='font-size:11px;color:var(--t3);padding:0 2px 8px;line-height:1.6';
    const dayBd=salesOnDayBreakdown(k);
    const parts=[rows.length+' entr'+(rows.length===1?'y':'ies')];
    if(dayBd.total>0){
      parts.push('sales '+fmt(dayBd.total));
      parts.push('net '+fmt(dayBd.total-dTot));
      // The cash line is what a drawer count for that day should come back to.
      parts.push('cash on hand '+fmt(dayBd.cash-dTot));
      if(dayBd.gcash>0)parts.push('GCash '+fmt(dayBd.gcash));
      if(dayBd.credit>0)parts.push('credit '+fmt(dayBd.credit));
    }
    dsub.textContent=parts.join(' · ');
    list.appendChild(dsub);

    rows.forEach(function(e){
      const row=document.createElement('div');row.className='exp-row';
      row.innerHTML='<div class="exp-dot"></div><div class="exp-info"><div class="exp-name">'+esc(e.name)+'</div>'
        +'<div class="exp-meta">'+esc(e.cat||'General')+' · '
        +new Date(e.date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</div></div>'
        +'<div class="exp-amt">'+fmt(e.amount)+'</div>';
      const del=document.createElement('button');del.className='exp-del';del.innerHTML='&times;';
      del.onclick=function(){
        uiConfirm('Delete this expense?',function(__ok){
          if(!__ok)return;
          syncExpenseDeleteToCloud(e);
          S.expenses=S.expenses.filter(function(x){return x.id!==e.id;});
          save();render();
        },{tone:'dang'});
      };
      row.appendChild(del);list.appendChild(row);
    });
  });
  scr.appendChild(list);
}

  const n=cc();

  // Low stock alert

    const gb=document.createElement('div');gb.className='goal-bar';

  scr.appendChild(cats);

  const grid=document.createElement('div');grid.className='prod-grid';
  grid.style.paddingBottom=n>0?'100px':'12px';
  items.forEach(p=>{
    const out=p.stock!==999&&p.stock<=0,low=p.stock!==999&&p.stock>0&&p.stock<=5;
    const effPrice=(p.salePct>0)?+(p.price*(1-p.salePct/100)).toFixed(2):p.price;
    const card=document.createElement('div');
    card.className='pcard'+(low?' low':'')+(out?' out':'')+(p.salePct>0?' on-sale':'');

    if(p.img){
      const im=document.createElement('img');im.src=p.img;im.className='pimg';im.onerror=function(){this.style.display='none';};inner.appendChild(im);
    } else {
      const ico=document.createElement('div');ico.className='pico';ico.textContent=p.icon;inner.appendChild(ico);
    }
    const pnm=document.createElement('div');pnm.className='pname';pnm.textContent=p.name;inner.appendChild(pnm);
    if(p.salePct>0){
      const po=document.createElement('div');po.className='pprice-orig';po.textContent=fmt(p.price);inner.appendChild(po);
      const ps=document.createElement('div');ps.className='pprice-sale';ps.textContent=fmt(effPrice);inner.appendChild(ps);
    } else {
      const pp2=document.createElement('div');pp2.className='pprice';pp2.textContent=fmt(p.price);inner.appendChild(pp2);
    }
    const pst=document.createElement('div');pst.className='pstock';pst.textContent=p.stock===999?'unlimited':out?'out of stock':low?p.stock+' left':p.stock+' in stock';inner.appendChild(pst);
    if(p.variants&&p.variants.length>0){const vh=document.createElement('div');vh.style.cssText='font-size:9px;color:var(--pt);font-weight:700;margin-top:2px';vh.textContent=p.variants.length+' variants';inner.appendChild(vh);}
    card.appendChild(inner);
    card.onclick=function(){
      if(p.variants&&p.variants.length>0){openModal({type:'variantPick',prod:p});return;}
      const ex=S.cart.find(i=>i.id===p.id&&!i.variantLabel);
      if(ex)ex.qty++;else S.cart.push({id:p.id,name:p.name,price:effPrice,qty:1,note:'',cat:p.cat||'Uncategorised',origPrice:p.salePct>0?p.price:null,salePct:p.salePct||0});
      render();toast(p.name+' added');

function renderCart(scr){

  back.onclick=function(){S.cartOpen=false;render();};

    hd.appendChild(clr);
  }
  scr.appendChild(hd);

  const items=document.createElement('div');items.className='cart-items';
  if(n===0){const e=document.createElement('div');e.className='cart-empty';e.textContent='Cart is empty';items.appendChild(e);}
  S.cart.forEach((it,idx)=>{
    const row=document.createElement('div');row.className='ci';

    const qty=document.createElement('div');qty.className='ci-qty';

    const num=document.createElement('span');num.className='qnum';num.textContent=it.qty;

  scr.appendChild(items);

  const foot=document.createElement('div');foot.className='cart-foot';

  const di=document.createElement('input');di.type='number';di.min='0';di.placeholder='Discount amount';di.value=S.disc||'';di.id='discInp';
  const ds=document.createElement('select');ds.id='discTypeSel';
  ['%','flat'].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;if(v===S.discType)o.selected=true;ds.appendChild(o);});
  dw.appendChild(di);dw.appendChild(ds);foot.appendChild(dw);

  // Quick % shortcut buttons
  const dq=document.createElement('div');dq.className='disc-quick';
  [5,10,15,20,25,30,50].forEach(pct=>{
    const qb=document.createElement('button');
    qb.className='disc-qbtn'+(S.disc===pct&&S.discType==='%'?' active':'');
    qb.textContent=pct+'%';
    qb.onclick=function(){
      if(S.disc===pct&&S.discType==='%'){S.disc=0;di.value='';}
      else{S.disc=pct;S.discType='%';di.value=pct;ds.value='%';}
      buildPreview(S.disc,S.discType);
      dq.querySelectorAll('.disc-qbtn').forEach(b=>{b.className='disc-qbtn'+(b.textContent===S.disc+'%'&&S.discType==='%'?' active':'');});
    };
    dq.appendChild(qb);
  });
  foot.appendChild(dq);

  // Live preview box
  const prev=document.createElement('div');prev.className='disc-preview';
  function buildPreview(discVal,discTypeVal){
    discVal=Math.max(0,discVal||0);
    const s2=sub();
    const da=discTypeVal==='%'?s2*Math.min(discVal,100)/100:Math.min(discVal,s2);
    const total2=s2-da;
    prev.innerHTML='';
    const r1=document.createElement('div');r1.className='disc-row-live';
    r1.innerHTML='<span>Subtotal</span><span>'+fmt(s2)+'</span>';prev.appendChild(r1);
    if(da>0){
      const r2=document.createElement('div');r2.className='disc-row-live saving';
      const label='Discount '+(discTypeVal==='%'?'('+Math.min(Math.round(discVal),100)+'%)':'(flat)');
      r2.innerHTML='<span>'+label+'</span><span>- '+fmt(da)+'</span>';prev.appendChild(r2);
    }
    const r3=document.createElement('div');r3.className='disc-row-live total';
    r3.innerHTML='<span>Total</span><span>'+fmt(total2)+'</span>';prev.appendChild(r3);
  }
  buildPreview(S.disc,S.discType);
  foot.appendChild(prev);

  di.oninput=function(){
    const v=Math.max(0,parseFloat(this.value)||0);S.disc=v;
    buildPreview(v,S.discType);
    dq.querySelectorAll('.disc-qbtn').forEach(b=>{b.className='disc-qbtn'+(b.textContent===v+'%'&&S.discType==='%'?' active':'');});
  };
  ds.onchange=function(){S.discType=this.value;buildPreview(S.disc,S.discType);};
  di.onblur=function(){render();};

  // Customer selector (only shows if cloud customers loaded)
  if(S.cloudCustomers&&S.cloudCustomers.length>0){
    const custSec=document.createElement('div');custSec.style.cssText='margin-bottom:10px;border-top:1px solid var(--b1);padding-top:10px';
    const custLbl=document.createElement('div');custLbl.style.cssText='font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px';custLbl.textContent='Customer (optional)';
    custSec.appendChild(custLbl);

function renderAtt(scr){
  const hd=document.createElement('div');hd.className='panel-hd';
  hd.innerHTML='<h2>Attendance</h2>';

  const ahd=document.createElement('div');

  ahd.textContent='Clock in / out';
  scr.appendChild(ahd);

  // Load cloud employees for this business
  const empList=S.cloudAttEmployees||[];

  if(!CLOUD.token||!CLOUD.bizId){
    const msg=document.createElement('div');msg.style.cssText='padding:8px 16px 28px;text-align:center;color:var(--t3);font-size:14px';msg.textContent='Sign in to cloud to use attendance tracking.';scr.appendChild(msg);return;
  }

  // Show current status of each employee
  const statusCard=document.createElement('div');statusCard.className='card';statusCard.style.marginBottom='14px';
  const stHd=document.createElement('div');stHd.style.cssText='font-size:13px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px';stHd.textContent='Today\'s status';
  statusCard.appendChild(stHd);

  if(!empList.length){
    statusCard.appendChild(document.createTextNode('No employees found. Add employees in the dashboard first.'));
  }
  empList.forEach(function(e){
    const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--b1)';
    const info=document.createElement('div');
    const dot=document.createElement('span');dot.style.cssText='display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:'+(e.clockedIn?'var(--st)':'var(--t3)');
    const name=document.createElement('span');name.style.cssText='font-size:15px;font-weight:600';name.textContent=e.name;
    const sub=document.createElement('div');sub.style.cssText='font-size:12px;color:var(--t3);margin-top:3px;margin-left:16px';
    sub.textContent=e.clockedIn?'Clocked in at '+e.timeIn:'Not clocked in';
    info.appendChild(dot);info.appendChild(name);info.appendChild(sub);
    const btn=document.createElement('button');
    btn.style.cssText='padding:10px 18px;border-radius:0;border:none;font-size:13px;font-weight:700;cursor:pointer;'+(e.clockedIn?'background:var(--dg);color:var(--dt)':'background:var(--sg);color:var(--st)');
    btn.textContent=e.clockedIn?'Clock Out':'Clock In';
    btn.onclick=async function(){
      btn.disabled=true;btn.style.opacity='0.5';
      const h2={...cloudHeaders(),'Prefer':'return=representation'};
      const today=new Date().toISOString().slice(0,10);
      if(e.clockedIn){
        // Clock out - find the open attendance record
        const attRes=await fetch(SUPA_URL+'/rest/v1/attendance?biz_id=eq.'+CLOUD.bizId+'&employee_id=eq.'+e.id+'&date=eq.'+today+'&time_out=is.null&order=time_in.desc&limit=1',{headers:h2});
        const attData=await attRes.json();
        if(attData&&attData[0]){
          const timeIn=new Date(attData[0].time_in);const timeOut=new Date();
          const hrs=Math.round((timeOut-timeIn)/36000)/100;
          await fetch(SUPA_URL+'/rest/v1/attendance?id=eq.'+attData[0].id,{method:'PATCH',headers:h2,body:JSON.stringify({time_out:timeOut.toISOString(),hours_worked:hrs})});
        }
        e.clockedIn=false;e.timeIn='';
        toast(e.name+' clocked out');
      } else {
        // Check if already clocked in today (prevent duplicates)
        const checkRes=await fetch(SUPA_URL+'/rest/v1/attendance?biz_id=eq.'+CLOUD.bizId+'&employee_id=eq.'+e.id+'&date=eq.'+today+'&time_out=is.null',{headers:h2});
        const existing=await checkRes.json();
        if(existing&&existing.length>0){toast(e.name+' is already clocked in!');btn.disabled=false;btn.style.opacity='1';return;}
        // Clock in
        await fetch(SUPA_URL+'/rest/v1/attendance',{method:'POST',headers:h2,body:JSON.stringify({biz_id:CLOUD.bizId,employee_id:e.id,employee_name:e.name,time_in:new Date().toISOString(),date:today})});
        e.clockedIn=true;e.timeIn=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        toast(e.name+' clocked in');
      }
      btn.disabled=false;btn.style.opacity='1';
      btn.textContent=e.clockedIn?'Clock Out':'Clock In';
      btn.style.background=e.clockedIn?'var(--dg)':'var(--sg)';
      btn.style.color=e.clockedIn?'var(--dt)':'var(--st)';
      sub.textContent=e.clockedIn?'Clocked in at '+e.timeIn:'Not clocked in';
      dot.style.background=e.clockedIn?'var(--st)':'var(--t3)';
    };
    row.appendChild(info);row.appendChild(btn);statusCard.appendChild(row);
  });
  scr.appendChild(statusCard);

  // Refresh button to reload employees
  const refBtn=document.createElement('button');refBtn.className='abtn';refBtn.textContent='Refresh employees';
  refBtn.style.cssText='width:100%;padding:14px;font-size:14px;font-weight:700;border-radius:0;cursor:pointer';
  refBtn.onclick=async function(){
    refBtn.textContent='Loading...';refBtn.disabled=true;
    toast('Loading employees...');
    try{
      await loadAttEmployees();
      if(S.cloudAttEmployees&&S.cloudAttEmployees.length>0){
        toast('Found '+S.cloudAttEmployees.length+' employee(s)');
      } else {
        toast('No employees found in Supabase');
      }
    }catch(e){toast('Error: '+e.message);}
    render();
  };
  scr.appendChild(refBtn);
}

async function loadAttEmployees(){
  if(!CLOUD.token){toast('Not signed in to cloud');return;}
  if(!CLOUD.bizId){
    try{
      const h2={...H,'Authorization':'Bearer '+CLOUD.token};
      const bizRes=await fetch(SUPA_URL+'/rest/v1/businesses?user_id=eq.'+CLOUD.user,{headers:h2});
      const bizData=await bizRes.json();
      if(bizData&&bizData[0]){CLOUD.bizId=bizData[0].id;save();}
      else{toast('No business found for this account');return;}
    }catch(e){toast('Could not find business');return;}
  }
  try{
    // Use authenticated headers so RLS allows reading employees
    const h2=cloudHeaders();
    const today=new Date().toISOString().slice(0,10);
    const empRes=await fetch(SUPA_URL+'/rest/v1/employees?biz_id=eq.'+CLOUD.bizId+'&active=eq.true&order=name',{headers:h2});
    const emps=await empRes.json();
    if(!Array.isArray(emps)||emps.length===0){
      toast('BizID: '+CLOUD.bizId+' — 0 employees');
      S.cloudAttEmployees=[];return;
    }
    const attRes=await fetch(SUPA_URL+'/rest/v1/attendance?biz_id=eq.'+CLOUD.bizId+'&date=eq.'+today,{headers:h2});
    const att=await attRes.json();
    S.cloudAttEmployees=emps.map(function(e){
      const todayAtt=Array.isArray(att)?att.filter(function(a){return a.employee_id===e.id&&!a.time_out;}):[];
      const latest=todayAtt.length>0?todayAtt[todayAtt.length-1]:null;
      return{id:e.id,name:e.name,role:e.role,clockedIn:!!latest,timeIn:latest?new Date(latest.time_in).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''};
    });
    // Auto-sync Cashier-role employees into the local cashiers list
    const cashierEmps=emps.filter(function(e){return e.role&&e.role.toLowerCase()==='cashier';});
    cashierEmps.forEach(function(e){
      const alreadyExists=S.cashiers.some(function(c){return c.name===e.name;});
      if(!alreadyExists){
        S.cashiers.push({id:S.cashierNid++,name:e.name,supaId:e.id});
        save();
      }
    });
    // Also remove from cashiers list if removed from Supabase (was cashier but no longer active)
    const allNames=emps.filter(function(e){return e.role&&e.role.toLowerCase()==='cashier';}).map(function(e){return e.name;});
    S.cashiers=S.cashiers.filter(function(c){
      // Keep manually added cashiers (no supaId) and active Supabase cashiers
      return !c.supaId||allNames.includes(c.name);
    });
    // If the active cashier was deactivated in Supabase, end their shift now
    if(S.activeCashier&&S.activeCashier.supaId&&!allNames.includes(S.activeCashier.name)){
      /* The drawer is deliberately NOT discarded. An open float that vanishes
         because someone edited the employee list on the Dashboard would erase
         the only record of what the cashier was holding, so the shift is
         closed as unreconciled and kept for review. */
      if(S.openShift){
        const b=shiftSalesBreakdown(S.openShift);
        const po=shiftPaidOut(S.openShift);
        S.shiftLog.push(Object.assign({},S.openShift,{
          endedAt:new Date().toISOString(),paidOut:po,
          expected:Math.round(expectedDrawer(S.openShift,po)*100)/100,
          countedCash:null,variance:0,unreconciled:true,
          cashSales:b.cash,gcashSales:b.gcash,creditSales:b.credit,
          otherSales:b.other,totalSales:b.total,txCount:b.count,
          closeNote:'Cashier deactivated on the Dashboard — drawer never counted',
          cloudSynced:false
        }));
        S.openShift=null;
      }
      S.activeCashier=null;S.shiftStart=null;
    }
    save();
  }catch(e){toast('Error loading employees: '+e.message);}
}

/* ==================================================================== *
 * PREPARATION SCREEN
 * Two views behind one tab: the raw ingredients a shop holds, and the
 * recipes that say how much of each a product consumes when it sells.
 * ==================================================================== */
function renderPrep(scr){
  const onIng=S.prepTab!=='rec';

  const hd=document.createElement('div');hd.className='panel-hd';
  hd.innerHTML='<h2>Preparation</h2>';
  const addb=document.createElement('button');addb.className='abtn';
  addb.textContent=onIng?'+ Ingredient':'+ Recipe';
  const openAdd=function(){
    if(onIng)openModal({type:'ing',ing:null});
    else openModal({type:'recipe',rec:null});
  };
  addb.onclick=openAdd;
  hd.appendChild(addb);scr.appendChild(hd);

  const bar=document.createElement('div');bar.className='hist-bar';
  [{id:'ing',lbl:'Ingredients'},{id:'rec',lbl:'Recipes'}].forEach(function(t){
    const p=document.createElement('button');
    p.className='hpill'+((onIng?'ing':'rec')===t.id?' on':'');
    p.textContent=t.lbl;
    p.onclick=function(){S.prepTab=t.id;render();};
    bar.appendChild(p);
  });
  scr.appendChild(bar);

  /* Outstanding cloud writes are stated plainly. Before this the till gave a
     cheerful "Recipe line added" and there was nowhere to find out that the
     Dashboard had never received it. */
  const pend=prepPendingCount();
  if(pend>0){
    const warn=document.createElement('div');
    warn.style.cssText='margin:0 14px 10px;padding:11px 13px;border-radius:0;background:var(--wg);border:1px solid var(--wt);display:flex;align-items:center;gap:10px;flex-wrap:wrap';
    const wtxt=document.createElement('div');
    wtxt.style.cssText='flex:1;min-width:150px;font-size:12.5px;color:var(--wt);font-weight:600;line-height:1.5';
    wtxt.textContent=pend+' item'+(pend===1?'':'s')+' not yet on the Dashboard'
      +(!navigator.onLine?' — device is offline'
        :(!CLOUD.token||!CLOUD.bizId)?' — not signed in to cloud':'');
    warn.appendChild(wtxt);
    const rbtn=document.createElement('button');
    rbtn.className='abtn';rbtn.style.cssText='font-size:12px;padding:8px 14px';
    rbtn.textContent='Sync now';
    rbtn.onclick=async function(){
      if(!CLOUD.token||!CLOUD.bizId){toast('Sign in to the cloud from Admin first');return;}
      if(!navigator.onLine){toast('Still offline — reconnect and try again');return;}
      rbtn.disabled=true;rbtn.textContent='Syncing...';
      const st=await retryPrepSync();
      const left=prepPendingCount();
      toast(left===0?'All prep data synced ✓':(st.ings+st.recipes)+' synced, '+left+' still pending');
      render();
    };
    warn.appendChild(rbtn);
    scr.appendChild(warn);
  }

  if(onIng)renderPrepIngredients(scr);
  else renderPrepRecipes(scr);

  const fab=document.createElement('button');fab.className='add-fab';fab.textContent='+';
  fab.setAttribute('aria-label',onIng?'Add ingredient':'Add recipe');

function renderPrepIngredients(scr){
  prepStats(scr,[
    {l:'Ingredients',v:S.ings.length,c:''},
    {l:'Low stock',v:lowIngs().length,c:'var(--wt)'},
    {l:'Out of stock',v:outIngs().length,c:'var(--dt)'}

  const list=document.createElement('div');list.className='prep-list';

  // The list repaints on its own so typing in the box never loses focus —
  // a full render() would tear the input out of the DOM on every keystroke.
  const paint=function(){
    list.innerHTML='';
    const q=(S.prepSearch||'').trim().toLowerCase();
    const rows=S.ings.filter(function(i){

      const used=S.recipes.filter(function(r){return r.ingId===ing.id;}).length;
      bits.push(used===1?'used in 1 product':'used in '+used+' products');

      st.textContent=ingQtyStr(ing.stock,ing.unit);
      ir.appendChild(st);

      const badge=document.createElement('span');
      badge.className='badge '+(lvl==='out'?'b-out':lvl==='low'?'b-low':'b-ok');

      const acts=document.createElement('div');acts.className='acts';
      const adj=document.createElement('button');adj.className='act';adj.textContent='\u00b1';
      adj.title='Adjust stock';adj.setAttribute('aria-label','Adjust stock for '+ing.name);
      adj.onclick=function(){openModal({type:'ingAdjust',ingId:ing.id});};
      const ed=document.createElement('button');ed.className='act';ed.textContent='ED';

      acts.appendChild(adj);acts.appendChild(ed);ir.appendChild(acts);

      row.appendChild(ir);list.appendChild(row);

  const search=document.createElement('div');search.className='pos-search';
  const si=document.createElement('input');si.placeholder='Search ingredients...';
  si.value=S.prepSearch||'';si.setAttribute('aria-label','Search ingredients');

  search.appendChild(si);scr.appendChild(search);

  const pills=document.createElement('div');pills.className='pos-cats';
  [{id:'all',lbl:'All'},{id:'low',lbl:'Low'},{id:'out',lbl:'Out'}].forEach(function(f){
    const c=document.createElement('button');
    c.className='cat'+(S.ingFilter===f.id?' on':'');

  scr.appendChild(list);

/* ==================================================================== *
 * PAYMENT BREAKDOWN
 * Splits takings by how they were paid. Cash, GCash and Card are always
 * shown so the layout stays put between filters; credit and any legacy
 * tender only appear when there is something to report.
 * ==================================================================== */
/* Card was withdrawn as a tender option. It is deliberately NOT listed here
   any more, but it is not erased either: sales already taken on Card fall
   through to the "unrecognised method" pass at the bottom of methodRows(),
   so historic takings still appear and the totals still balance. Deleting it
   outright would have quietly dropped that money out of every report. */
const PAY_METHODS=[
  {id:'Cash', lbl:'Cash',  c:'var(--st)', always:true},
  {id:'GCash',lbl:'GCash', c:'var(--pt)', always:true},
  {id:'Utang',lbl:'Credit',c:'var(--wt)', always:false, credit:true},
];

/* Voided sales are excluded — they took no money. Anything with an
   unrecognised method still gets counted rather than silently dropped. */
function tallyByMethod(txs){
  const t={};
  PAY_METHODS.forEach(function(p){t[p.id]={count:0,total:0};});
  (txs||[]).forEach(function(s){
    if(s.voided)return;
    const k=s.method||'Cash';
    if(!t[k])t[k]={count:0,total:0};
    t[k].count++;
    t[k].total+=(+s.total||0);
  });
  return t;
}

// Ordered list of the methods worth displaying for this set of sales.
function methodRows(tally){
  const rows=[];
  PAY_METHODS.forEach(function(p){
    if(p.always||tally[p.id].count>0)rows.push({...p,d:tally[p.id]});
  });
  Object.keys(tally).forEach(function(k){
    if(PAY_METHODS.some(function(p){return p.id===k;}))return;
    if(tally[k].count>0)rows.push({id:k,lbl:k,c:'var(--t2)',d:tally[k]});
  });
  return rows;
}

function renderPaySummary(scr,txs){
  const tally=tallyByMethod(txs);
  const rows=methodRows(tally);

  const grid=document.createElement('div');grid.className='paysum';
  rows.forEach(function(r){
    const cell=document.createElement('div');
    cell.className='paycell'+(r.credit?' credit':'');
    const l=document.createElement('div');l.className='paycell-l';
    l.style.color=r.c;l.textContent=r.lbl;
    const v=document.createElement('div');v.className='paycell-v';
    v.textContent=fmt(r.d.total);
    const nn=document.createElement('div');nn.className='paycell-n';
    nn.textContent=r.d.count+(r.d.count===1?' sale':' sales');
    cell.appendChild(l);cell.appendChild(v);cell.appendChild(nn);
    grid.appendChild(cell);
  });
  scr.appendChild(grid);

  // Spell out what the collected figure does and does not include.
  const credit=tally['Utang']?tally['Utang'].total:0;
  const collected=rows.reduce(function(a,r){return a+(r.credit?0:r.d.total);},0);
  const note=document.createElement('div');note.className='paysum-note';
  note.textContent=credit>0
    ? 'Collected '+fmt(collected)+' \u00b7 a further '+fmt(credit)+' is on credit and still owed.'
    : 'Collected '+fmt(collected)+' across '+rows.reduce(function(a,r){return a+r.d.count;},0)+' sales. Voided sales are excluded.';
  scr.appendChild(note);
}

// Compact one-line version used under each day heading.
function dayPayLine(txs){
  const tally=tallyByMethod(txs);
  const rows=methodRows(tally).filter(function(r){return r.d.count>0;});
  if(!rows.length)return null;
  const wrap=document.createElement('div');wrap.className='day-pay';
  rows.forEach(function(r){
    const s=document.createElement('span');
    s.textContent=r.lbl+' ';
    const b=document.createElement('b');b.style.color=r.c;b.textContent=fmt(r.d.total);
    s.appendChild(b);
    wrap.appendChild(s);
  });
  return wrap;
}

/* ==================================================================== *
 * CATEGORY BREAKDOWN
 *
 * Sale lines only ever stored name/qty/price, so the category has to be
 * recovered from the product list for anything sold before this build.
 * New sales now carry their own `cat` (see the checkout handlers), which
 * keeps the figures right even after a product is renamed or retired.
 * ==================================================================== */
function catOfSaleItem(it){
  if(it&&it.cat)return it.cat;
  const p=(S.prods||[]).filter(function(x){return x.name===(it&&it.name);})[0];
  return (p&&p.cat)||'Uncategorised';
}

// {cat:{qty,total}} for a set of sales. Voided sales took no money.
function tallyByCategory(txs){
  const map={};
  (txs||[]).forEach(function(s){
    if(s.voided)return;
    (s.items||[]).forEach(function(it){
      const c=catOfSaleItem(it);
      if(!map[c])map[c]={qty:0,total:0};
      map[c].qty+=(+it.qty||0);
      map[c].total+=(+it.price||0)*(+it.qty||0);
    });
  });
  return map;
}

/* Builds the "Sales by category" panel. `title` lets the same builder serve
   both the period summary and the smaller per-day block. */
function catBreakdownBox(txs,title){
  const map=tallyByCategory(txs);
  const rows=Object.entries(map).sort(function(a,b){return b[1].total-a[1].total;});
  if(!rows.length)return null;
  const box=document.createElement('div');
  box.style.cssText='background:var(--bg2);border:1px solid var(--b1);border-radius:0;padding:10px 12px;margin-bottom:12px';
  const hd=document.createElement('div');
  hd.style.cssText='font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;display:flex;justify-content:space-between';
  hd.innerHTML='<span>'+esc(title||'Sales by category')+'</span>'
    +'<span style="display:grid;grid-template-columns:36px 90px;gap:4px;text-align:center"><span>Qty</span><span style="text-align:right">Total</span></span>';
  box.appendChild(hd);
  const grand=rows.reduce(function(a,r){return a+r[1].total;},0);
  rows.forEach(function(e){
    const name=e[0],d=e[1];
    const pct=grand>0?Math.round(d.total/grand*100):0;
    const row=document.createElement('div');
    row.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--b1);font-size:13px';
    row.innerHTML='<span style="color:var(--t1);font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(name)
      +' <span style="color:var(--t3);font-weight:600;font-size:11px">'+pct+'%</span></span>'
      +'<span style="display:grid;grid-template-columns:36px 90px;gap:4px;text-align:center;flex-shrink:0">'
      +'<span style="color:var(--t2);font-weight:700;text-align:center">'+d.qty+'</span>'
      +'<span style="color:var(--ac);font-weight:700;text-align:right">'+fmt(d.total)+'</span></span>';
    box.appendChild(row);
  });
  const totRow=document.createElement('div');
  totRow.style.cssText='display:flex;justify-content:space-between;padding:6px 0 0;font-size:13px;font-weight:800';
  const totQty=rows.reduce(function(a,r){return a+r[1].qty;},0);
  totRow.innerHTML='<span style="color:var(--t1)">Total ('+rows.length+' categor'+(rows.length===1?'y':'ies')+')</span>'
    +'<span style="display:grid;grid-template-columns:36px 90px;gap:4px;flex-shrink:0">'
    +'<span style="color:var(--t2);font-weight:800;text-align:center">'+totQty+'</span>'
    +'<span style="color:var(--ac);font-weight:800;text-align:right">'+fmt(grand)+'</span></span>';
  box.appendChild(totRow);
  return box;
}

/* A date input plus a Clear button, shared by History and Expenses. Picking a
   day overrides the range pills; clearing it hands control back to them. */
function dayPickerRow(getVal,setVal){
  const wrap=document.createElement('div');
  wrap.style.cssText='display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--b1);flex-shrink:0;flex-wrap:wrap';
  const lbl=document.createElement('label');
  lbl.style.cssText='font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.4px';
  lbl.textContent='Pick a date';
  const inp=document.createElement('input');
  inp.type='date';
  inp.value=getVal()||'';
  // Future days hold nothing, so they are not offerable.
  inp.max=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  inp.style.cssText='flex:1;min-width:140px;padding:9px 11px;border-radius:0;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:14px;outline:none';
  inp.onchange=function(){setVal(inp.value||'');render();};
  lbl.setAttribute('for','dayPick');inp.id='dayPick';
  wrap.appendChild(lbl);wrap.appendChild(inp);
  if(getVal()){
    const clr=document.createElement('button');
    clr.className='abtn';clr.style.cssText='font-size:12px;padding:8px 14px';
    clr.textContent='Clear';
    clr.onclick=function(){setVal('');render();};
    wrap.appendChild(clr);
  }
  return wrap;
}

// A local YYYY-MM-DD key. toISOString() would shift the day across UTC.
function dayKey(d){
  const x=new Date(d);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
}

function renderHist(scr){
  const filt=S.sales.filter(s=>{
    const d=new Date(s.date);
    // An explicit date beats the range pills.
    if(S.histDate)return dayKey(d)===S.histDate;
    if(S.histFilter==='today')return d.toDateString()===new Date().toDateString();
    if(S.histFilter==='week'){const w=new Date();w.setDate(w.getDate()-7);return d>=w;}
    if(S.histFilter==='month'){const m=new Date();m.setDate(m.getDate()-30);return d>=m;}
    return true;
  });
  const totalAmt=filt.filter(s=>!s.voided).reduce((a,s)=>a+s.total,0);

  const hd=document.createElement('div');hd.className='panel-hd';
  const hdTitle=document.createElement('h2');hdTitle.textContent='History';hd.appendChild(hdTitle);
  const expBtn=document.createElement('button');expBtn.className='abtn';expBtn.style.cssText='font-size:12px;padding:7px 12px';expBtn.textContent='CSV';expBtn.onclick=function(){exportCSV(filt);};hd.appendChild(expBtn);
  const hdTot=document.createElement('div');hdTot.style.cssText='text-align:right';
  hdTot.innerHTML='<div style="font-size:16px;font-weight:800">'+fmt(totalAmt)+'</div><div style="font-size:11px;color:var(--t3)">'+filt.filter(s=>!s.voided).length+' transactions</div>';
  hd.appendChild(hdTot);
  scr.appendChild(hd);

  const bar=document.createElement('div');bar.className='hist-bar';
  [{id:'all',lbl:'All time'},{id:'today',lbl:'Today'},{id:'week',lbl:'This week'},{id:'month',lbl:'This month'}].forEach(f=>{
    // Greyed out while a specific date is active, so it is obvious which
    // control is actually driving the list.
    const p=document.createElement('div');p.className='hpill'+((!S.histDate&&S.histFilter===f.id)?' on':'');p.textContent=f.lbl;
    if(S.histDate)p.style.opacity='0.45';
    p.onclick=function(){S.histFilter=f.id;S.histDate='';render();};
    bar.appendChild(p);
  });
  scr.appendChild(bar);

  scr.appendChild(dayPickerRow(function(){return S.histDate;},function(v){S.histDate=v;}));

  if(S.histDate){
    const noteRow=document.createElement('div');
    noteRow.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;flex-wrap:wrap';
    const note=document.createElement('div');
    note.style.cssText='font-size:12px;color:var(--t3);font-weight:600;flex:1;min-width:150px';
    note.textContent='Showing '+new Date(S.histDate+'T00:00:00').toLocaleDateString('en-PH',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    noteRow.appendChild(note);
    /* Only offered once a single date is in view, so there is no way to fire
       it at a range by accident. The modal still asks for the password. */
    if(filt.length>0){
      const dbtn=document.createElement('button');
      dbtn.className='abtn';
      dbtn.style.cssText='font-size:12px;padding:8px 13px;color:var(--dt)';
      dbtn.textContent='Delete this date';
      dbtn.onclick=function(){openModal({type:'deleteDaySales',date:S.histDate});};
      noteRow.appendChild(dbtn);
    }
    scr.appendChild(noteRow);
  }

  renderPaySummary(scr,filt);

  /* Category totals for whatever period is on screen. Wrapped in the same
     padding as the lists below so it lines up with them. */
  const catWrap=document.createElement('div');catWrap.style.cssText='padding:0 14px';
  const catBox=catBreakdownBox(filt,'Sales by category');
  if(catBox)catWrap.appendChild(catBox);
  else{
    const em=document.createElement('div');
    em.style.cssText='padding:10px 2px 14px;font-size:12.5px;color:var(--t3)';
    em.textContent='No category sales in this period.';
    catWrap.appendChild(em);
  }
  scr.appendChild(catWrap);

  const byDay={};
  filt.slice().reverse().forEach(s=>{const k=new Date(s.date).toDateString();if(!byDay[k])byDay[k]=[];byDay[k].push(s);});

  const list=document.createElement('div');list.className='hist-list';
  if(Object.keys(byDay).length===0){const e=document.createElement('div');e.className='hist-empty';e.textContent='No transactions yet.';list.appendChild(e);}
  Object.entries(byDay).forEach(([ds,txs])=>{
    const today=new Date().toDateString(),yest=new Date(Date.now()-86400000).toDateString();
    const lbl=ds===today?'Today':ds===yest?'Yesterday':new Date(ds).toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'});
    const dayTot=txs.reduce((a,s)=>a+s.total,0);
    const dl=document.createElement('div');dl.className='day-lbl';dl.textContent=lbl;list.appendChild(dl);
    const ds2=document.createElement('div');ds2.className='day-sub';ds2.textContent=txs.length+' transaction'+(txs.length!==1?'s':'')+' - '+fmt(dayTot);list.appendChild(ds2);
    const dayPay=dayPayLine(txs);
    if(dayPay)list.appendChild(dayPay);
    txs.forEach(s=>{
      const card=document.createElement('div');card.className='txcard'+(s.voided?' voided':'');
      /* The method lands in a class attribute as well as in text. Stripped to
         letters and digits for the class — a method containing a quote would
         otherwise break out of the attribute — and escaped for the label. */
      const mRaw=s.voided?'Voided':(s.method||'Cash');
      const mCls=String(mRaw).replace(/[^A-Za-z0-9]/g,'');
      card.innerHTML='<div class="txl"><div class="txid">'+esc(s.id)+(s.cashier?' · '+esc(s.cashier):'')+'</div><div class="txitems">'+s.items.map(i=>esc(i.name)+' x'+i.qty).join(', ')+'</div><div class="txtime">'+new Date(s.date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</div></div><div class="txr"><div class="txtot">'+fmt(s.total)+'</div><div class="txm m'+mCls+'">'+esc(s.voided?'VOID':mRaw)+'</div></div>';
      card.onclick=function(){openModal({type:'viewtx',tx:s});};
      list.appendChild(card);
    });
    // Per-day category totals, sitting above the item-level detail.
    const dayCat=catBreakdownBox(txs,'Category totals · '+lbl);
    if(dayCat)list.appendChild(dayCat);

    // Items sold breakdown for this day
    const validTxs=txs.filter(s=>!s.voided);
    if(validTxs.length>0){
      const itemMap={};
      validTxs.forEach(s=>s.items.forEach(it=>{
        if(!itemMap[it.name])itemMap[it.name]={qty:0,total:0};
        itemMap[it.name].qty+=it.qty;
        itemMap[it.name].total+=it.price*it.qty;
      }));
      const sorted=Object.entries(itemMap).sort((a,b)=>b[1].qty-a[1].qty);
      const itBox=document.createElement('div');
      itBox.style.cssText='background:var(--bg2);border:1px solid var(--b1);border-radius:0;padding:10px 12px;margin-bottom:12px';
      const itHd=document.createElement('div');
      itHd.style.cssText='font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;display:flex;justify-content:space-between';
      itHd.innerHTML='<span>Items sold</span><span style="display:grid;grid-template-columns:36px 90px;gap:4px;text-align:center"><span>Qty</span><span style="text-align:right">Total</span></span>';
      itBox.appendChild(itHd);
      sorted.forEach(([name,d])=>{
        const row=document.createElement('div');
        row.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--b1);font-size:13px';
        row.innerHTML='<span style="color:var(--t1);font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(name)+'</span>'
          +'<span style="display:grid;grid-template-columns:36px 90px;gap:4px;text-align:center;flex-shrink:0">'
          +'<span style="color:var(--t2);font-weight:700;text-align:center">'+d.qty+'</span>'
          +'<span style="color:var(--ac);font-weight:700;text-align:right">'+fmt(d.total)+'</span></span>';
        itBox.appendChild(row);
      });
      const totRow=document.createElement('div');
      totRow.style.cssText='display:flex;justify-content:space-between;padding:6px 0 0;font-size:13px;font-weight:800';
      const totalItemQty=sorted.reduce((a,[,d])=>a+d.qty,0);
      const validDayTot=validTxs.reduce((a,s)=>a+s.total,0);
      totRow.innerHTML='<span style="color:var(--t1)">Total items sold</span>'
        +'<span style="display:grid;grid-template-columns:36px 90px;gap:4px;flex-shrink:0">'
        +'<span style="color:var(--t2);font-weight:800;text-align:center">'+totalItemQty+'</span>'
        +'<span style="color:var(--ac);font-weight:800;text-align:right">'+fmt(validDayTot)+'</span></span>';
      itBox.appendChild(totRow);
      list.appendChild(itBox);
    }
  });
  scr.appendChild(list);
}

/* One lock screen serves Admin, Inventory and Preparation. Everything the
   three differ on is passed in; the password checked is always S.pass. */
function renderLock(scr,opts){
  opts=opts||{};
  const badge=opts.badge||'ADMIN';
  const title=opts.title||'Admin access';
  const sub=opts.sub||'Enter your password to continue.';
  const onUnlock=opts.onUnlock||function(){S.locked=false;render();};

  const w=document.createElement('div');w.className='lock-wrap';
  const card=document.createElement('div');card.className='lock-card';
  const bd=document.createElement('div');bd.className='lock-ico';bd.textContent=badge;
  const h=document.createElement('h2');h.style.cssText='font-size:20px;font-weight:650;letter-spacing:-.02em;color:var(--t1)';h.textContent=title;
  const p=document.createElement('p');p.style.cssText='font-size:14px;color:var(--t2);line-height:1.6';p.textContent=sub;
  card.appendChild(bd);card.appendChild(h);card.appendChild(p);

  const inp=document.createElement('input');inp.className='lock-inp';inp.type='password';inp.placeholder='Password';inp.maxLength=30;
  inp.setAttribute('aria-label',title);
  const err=document.createElement('div');err.className='lock-err';err.setAttribute('role','alert');
  const btn=document.createElement('button');btn.className='lock-btn';btn.textContent='Unlock';
  const tryUnlock=function(){
    if(inp.value===S.pass){onUnlock();}
    else{err.textContent='Incorrect password.';inp.value='';inp.focus();}
  };
  btn.onclick=tryUnlock;
  inp.onkeydown=function(e){if(e.key==='Enter')tryUnlock();};
  card.appendChild(inp);card.appendChild(err);card.appendChild(btn);

  // A bad custom theme can leave the app unreadable, and Admin is where the
  // colour is changed — so the escape hatch belongs on the Admin lock only.
  if(opts.showThemeReset){
    const resetThemeBtn=document.createElement('button');
    resetThemeBtn.style.cssText='width:100%;padding:11px;border-radius:0;border:1px solid var(--b1);background:transparent;color:var(--t2);font-size:12.5px;font-weight:550;cursor:pointer;margin-top:-4px';
    resetThemeBtn.textContent='Reset to dark theme';
    resetThemeBtn.onclick=function(){S.themeColor='#2e2e33';applyTheme('#2e2e33');save();saveSettingsToCloud();toast('Theme reset');};
    card.appendChild(resetThemeBtn);
  }
  w.appendChild(card);scr.appendChild(w);
  setTimeout(function(){try{inp.focus();}catch(e){}},60);
}

  function logSync(msg,ok){
    syncLog.style.display='block';
    const line=document.createElement('div');
    line.style.color=ok===true?'var(--st)':ok===false?'var(--dt)':'var(--t2)';
    line.textContent=(ok===true?'✓ ':ok===false?'✗ ':'→ ')+msg;
    syncLog.appendChild(line);syncLog.scrollTop=syncLog.scrollHeight;
  }
  const syncBtn=document.createElement('button');syncBtn.className='abtn';syncBtn.textContent='Sync now';
  syncBtn.onclick=async function(){
    syncLog.innerHTML='';syncLog.style.display='block';
    syncBtn.textContent='Syncing...';syncBtn.style.opacity='0.6';
    logSync('Starting sync...');
    // Check CLOUD state
    logSync('Token: '+(CLOUD.token?'present ('+CLOUD.token.slice(0,12)+'...)':'MISSING'),!!CLOUD.token);
    logSync('BizId: '+(CLOUD.bizId||'MISSING'),!!CLOUD.bizId);
    logSync('Products local: '+S.prods.length+' items');
    const offlineCount=queueCount();
    if(offlineCount>0)logSync('Offline queue: '+offlineCount+' item(s) waiting to push');
    if(!CLOUD.token||!CLOUD.bizId){
      logSync('Cannot sync — not connected. Sign out and sign in again.',false);
      toast('Not connected. Sign out and sign in again.');
      syncBtn.textContent='Sync now';syncBtn.style.opacity='1';return;
    }
    // Ensure session is valid — auto-refresh or show inline re-auth (no sign out needed)
    logSync('Checking session...');
    const authed=await ensureAuth();
    if(!authed){logSync('Authentication cancelled.',false);syncBtn.textContent='Sync now';syncBtn.style.opacity='1';return;}
    logSync('Session OK',true);
    // Flush offline queue first — push any sales/expenses recorded while offline
    const pending=queueCount();

      logSync('Found '+pending+' offline item(s) to push...');
      await flushSyncQueue(logSync);

    // Push settings

    // Pull from cloud
