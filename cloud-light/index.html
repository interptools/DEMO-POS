<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#1a1a18"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Arroyo POS"/>
<meta name="description" content="Universal Point of Sale by Reymar Arroyo"/>

<title>Brew & Bite Café POS — free trial</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:rgba(0,0,0,0.1)}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg0);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI Variable Text','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;font-feature-settings:'cv11','ss01';-webkit-font-smoothing:antialiased;position:fixed;top:0;left:0}
input,select,textarea{user-select:text;-webkit-user-select:text}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:rgba(28,28,26,0.18);border-radius:3px}

/* CSS VARIABLES */
:root{
  /* CARBON COPY — a working receipt book.
     The paper is fixed manila and the ink is true black; applyTheme() only
     replaces --ac / --ac2 from the client's brand colour. Surfaces never take
     the brand hue, so every deploy reads as the same product. */
  --bg0:#edebe3;   /* manila page */
  --bg1:#faf9f4;   /* raised sheet: bars, sheets, footers */
  --bg2:#ffffff;   /* a cell you can write in: inputs, tiles */
  --bg3:#dfdcd1;   /* pressed, chips, carbon smudge */
  --t1:#000000;--t2:#3a3a33;--t3:#5c5c54;
  --b1:rgba(0,0,0,0.20);   /* hairline, for row separators only */
  --b2:#000000;            /* keyline: the structural line of the whole app */
  --ac:#1b3a8c;--ac2:#e4e8f4;
  /* Stamp inks. Rectangular, not rounded — these are stamps, not badges. */
  --sg:#ddebdf;--st:#1f6b3a;
  --wg:#f5e6c8;--wt:#7a4e10;
  --dg:#fcebe9;--dt:#c8241c;--df:#c8241c;
  --pg:#e3e0f0;--pt:#3e3577;
  --r:0px;
}

/* APP SHELL */
#app{height:100dvh;width:100vw;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--bg0)}

/* TOP NAV */
.topnav{background:var(--bg1);border-bottom:1px solid var(--b1);flex-shrink:0;display:flex;flex-direction:column}
.topnav-brand{display:flex;align-items:center;padding:10px 14px 0;gap:8px}
.brand-name{font-size:16px;font-weight:700;flex:1}
.brand-tag{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--ac2);color:var(--ac)}
.net-status-wrap{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--t3)}
.topnav-tabs{display:flex;overflow-x:auto;padding:0 4px}
.topnav-tabs::-webkit-scrollbar{height:0}
.tab{flex:1;min-width:60px;padding:10px 8px;font-size:11px;font-weight:700;color:var(--t3);border:none;background:none;cursor:pointer;border-bottom:2.5px solid transparent;text-align:center;letter-spacing:0.3px;white-space:nowrap}
.tab.on{color:var(--t1);border-bottom-color:var(--ac)}

/* BIZ SCREEN */
.biz-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;gap:20px;overflow-y:auto}
.biz-logo{font-size:30px;font-weight:800;letter-spacing:-1px}
.biz-sub{font-size:14px;color:var(--t2)}
.biz-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:380px}
.biz-card{background:var(--bg2);border:1.5px solid var(--b1);border-radius:16px;padding:22px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;-webkit-tap-highlight-color:rgba(55,138,221,0.2)}
.biz-card:active{background:var(--bg3);transform:scale(0.96)}
.biz-ico{font-size:12px;font-weight:800;color:var(--t2);background:var(--bg3);padding:8px 12px;border-radius:8px;letter-spacing:0.5px}
.biz-lbl{font-size:13px;font-weight:600;text-align:center}
.biz-note{font-size:12px;color:var(--t3);text-align:center;max-width:300px;line-height:1.7}

/* SCREEN CONTENT */
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--bg0);color:var(--t1);min-height:0}

/* POS */
.pos-search{padding:10px 12px;flex-shrink:0}
.pos-search input{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:15px;outline:none}
.pos-cats{display:flex;gap:7px;padding:0 12px 10px;overflow-x:auto;flex-shrink:0}
.pos-cats::-webkit-scrollbar{height:0}
.cat{padding:8px 16px;border-radius:20px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.cat.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.prod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 10px 100px;overflow-y:auto;flex:1;align-content:start}
.pcard{background:var(--bg2);border:1.5px solid var(--b1);border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;position:relative;overflow:hidden}.pcard::before{content:'';display:block;padding-top:100%}.pcard-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px}
.pcard:active{background:var(--bg3);transform:scale(0.94)}
.pico{font-size:10px;font-weight:800;color:var(--t2);background:var(--bg3);padding:5px 8px;border-radius:6px;letter-spacing:0.5px}
.pname{font-size:11px;font-weight:600;line-height:1.2}
.pprice{font-size:12px;font-weight:700;color:var(--ac)}
.pstock{font-size:9px;color:var(--t3)}
.pcard.low .pstock{color:var(--wt)}
.pcard.out{opacity:0.3;pointer-events:none}

/* CART FAB */
.cart-fab{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:12px;right:12px;background:var(--ac);border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:12px;border:none;cursor:pointer;z-index:500;box-shadow:0 10px 30px -8px rgba(28,28,26,.38)}
.cart-fab:active{opacity:0.85}
.fab-info{flex:1;text-align:left}
.fab-count{font-size:12px;color:rgba(255,255,255,0.75);margin-bottom:2px}
.fab-total{font-size:18px;font-weight:800;color:#fff}
.fab-lbl{font-size:13px;font-weight:700;color:#fff;background:rgba(255,255,255,0.2);padding:8px 14px;border-radius:10px}

/* CART SCREEN */
.cart-hd{display:flex;align-items:center;padding:12px 14px;gap:10px;border-bottom:1px solid var(--b1);flex-shrink:0}
.cart-back{padding:10px 16px;border-radius:10px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:14px;font-weight:600;cursor:pointer}
.cart-back:active{background:var(--bg3)}
.cart-title{font-size:17px;font-weight:700;flex:1}
.cart-clear{font-size:13px;color:var(--dt);background:none;border:none;cursor:pointer;padding:8px 10px;font-weight:600}
.cart-items{flex:1;overflow-y:auto;padding:0 14px;min-height:0}
.cart-empty{text-align:center;color:var(--t3);font-size:14px;padding:48px 0}
.ci{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--b1)}
.ci-info{flex:1}
.ci-name{font-size:15px;font-weight:600}
.ci-price{font-size:13px;color:var(--t2);margin-top:2px}
.ci-qty{display:flex;align-items:center;gap:10px}
.qb{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qb:active{background:var(--bg3)}
.qnum{font-size:16px;font-weight:700;min-width:24px;text-align:center}
.ci-sub{font-size:16px;font-weight:700;color:var(--ac);min-width:70px;text-align:right;flex-shrink:0}
.cart-foot{padding:10px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--b1);flex-shrink:0;background:var(--bg1);position:sticky;bottom:0;z-index:10}
.disc-row{display:flex;gap:8px;margin-bottom:8px}
.disc-row input{flex:1;padding:9px 10px;border-radius:10px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:14px;outline:none}
.disc-row select{padding:9px 8px;border-radius:10px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:14px;outline:none}
.sum{display:flex;justify-content:space-between;font-size:13px;color:var(--t2);padding:3px 0}
.sum-total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding:8px 0 10px;border-top:1px solid var(--b1);margin-top:4px}
.pay-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.pbtn{padding:14px 8px;border-radius:12px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:14px;font-weight:700;cursor:pointer;text-align:center;display:block;width:100%}
.pbtn:active{background:var(--bg3);transform:scale(0.97)}
.pbtn.big{grid-column:1/-1;background:var(--ac);color:#fff;border-color:var(--ac);font-size:16px;font-weight:800;padding:18px;border-radius:14px}
.pbtn.big:active{opacity:0.85}

/* INVENTORY */
/* The Attendance panel has always set className='card', but no such rule
   existed — that block was rendering completely unstyled. */
.card{background:var(--bg2);border:1px solid var(--b1);border-radius:14px;padding:14px;margin:0 14px}
.panel-hd{padding:14px 16px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-hd h2{font-size:18px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px;flex-shrink:0}
.stat{background:var(--bg2);border-radius:12px;padding:12px}
.stat-l{font-size:10px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.stat-v{font-size:20px;font-weight:800}
.inv-list{flex:1;overflow-y:auto}
.inv-row{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--b1)}
.inv-ico{font-size:11px;font-weight:700;color:var(--t2);background:var(--bg2);padding:8px 10px;border-radius:8px;min-width:44px;text-align:center;flex-shrink:0}
.inv-info{flex:1;overflow:hidden}
.inv-name{font-size:15px;font-weight:600}
.inv-cat{font-size:12px;color:var(--t3);margin-top:2px}
.inv-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.inv-price{font-size:15px;font-weight:700;color:var(--ac)}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.b-ok{background:var(--sg);color:var(--st)}
.b-low{background:var(--wg);color:var(--wt)}
.b-out{background:var(--dg);color:var(--dt)}
.acts{display:flex;gap:6px}
.act{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--b1);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:11px;font-weight:700}
.act:active{background:var(--bg2)}
.act.del:active{background:var(--dg);color:var(--dt)}
.add-fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));right:20px;width:56px;height:56px;border-radius:50%;background:var(--ac);border:none;color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px -6px rgba(28,28,26,.34);z-index:400}
.add-fab:active{opacity:0.85}

/* HISTORY */
.hist-bar{display:flex;gap:7px;padding:10px 14px;border-bottom:1px solid var(--b1);overflow-x:auto;flex-shrink:0}
.hist-bar::-webkit-scrollbar{height:0}
.hpill{padding:8px 14px;border-radius:20px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.hpill.on{background:var(--t1);color:var(--bg0);border-color:var(--t1)}
.hist-list{flex:1;overflow-y:auto;padding:12px 16px}
.hist-empty{text-align:center;color:var(--t3);font-size:14px;padding:48px 0}
.day-lbl{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;padding:6px 0 4px}
.day-sub{font-size:12px;color:var(--t2);margin-bottom:8px}
.txcard{background:var(--bg2);border:1.5px solid var(--b1);border-radius:14px;padding:14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px}
.txcard:active{background:var(--bg3)}
.txl{flex:1;overflow:hidden}
.txid{font-size:10px;color:var(--t3);font-weight:700;margin-bottom:3px}
.txitems{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txtime{font-size:12px;color:var(--t2);margin-top:3px}
.txr{text-align:right;flex-shrink:0}
.txtot{font-size:16px;font-weight:800}
.txm{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;display:inline-block;margin-top:3px}
.mCash{background:var(--sg);color:var(--st)}
.mCard{background:var(--ac2);color:var(--ac)}
.mGCash{background:var(--pg);color:var(--pt)}
.mUtang{background:var(--wg);color:var(--wt)}
.mTransfer{background:var(--wg);color:var(--wt)}

/* ADMIN */
.admin-scroll{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.asec{background:var(--bg2);border:1.5px solid var(--b1);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.asec-t{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px}
.arow{display:flex;flex-direction:column;gap:6px}
.arow label{font-size:13px;color:var(--t2);font-weight:600}
.arow input,.arow select{padding:12px;border-radius:10px;border:1.5px solid var(--b2);background:var(--bg1);color:var(--t1);font-size:15px;outline:none;width:100%}
.abtnrow{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.abtn{padding:11px 18px;border-radius:10px;border:1.5px solid var(--b2);background:var(--bg1);color:var(--t1);font-size:14px;font-weight:600;cursor:pointer}
.abtn:active{background:var(--bg3)}
.abtn.pri{background:var(--t1);color:var(--bg0);border-color:var(--t1)}
.asec.danger{border-color:var(--dg)}
.asec.danger .asec-t{color:var(--dt)}
.asec.creator{border-color:var(--pg)}
.asec.creator .asec-t{color:var(--pt)}
.cp-row{display:flex;gap:8px;flex-wrap:wrap}
.cp{padding:10px 14px;border-radius:20px;border:none;font-size:12px;font-weight:700;cursor:pointer;color:#fff}
.cp:active{opacity:0.8;transform:scale(0.96)}
.cp.light{color:#333}

/* ABOUT */
.about-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.about-card{background:var(--bg2);border:1.5px solid var(--b1);border-radius:16px;padding:22px;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.av{width:60px;height:60px;border-radius:50%;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--ac)}
.divl{width:100%;height:1px;background:var(--b1)}
.cr{display:flex;align-items:center;gap:12px;width:100%;font-size:14px;color:var(--t2)}
.cico{font-size:11px;font-weight:700;color:var(--t3);min-width:22px}

/* LOCK */
.lock-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg0)}
.lock-card{background:var(--bg1);border:2px solid var(--b2);border-radius:0;padding:32px 24px;width:100%;max-width:330px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;box-shadow:5px 5px 0 #000;color:var(--t1)}
.lock-ico{font-size:12px;font-weight:650;color:var(--t2);background:var(--bg3);padding:9px 15px;border-radius:999px;letter-spacing:.2px}
.lock-card h2{font-size:20px;font-weight:700}
.lock-card p{font-size:14px;color:var(--t2)}
.lock-inp{width:100%;padding:16px;border-radius:12px;border:1px solid var(--b2);background:var(--bg0);color:var(--t1);font-size:20px;text-align:center;letter-spacing:6px;outline:none;font-variant-numeric:tabular-nums}
.lock-inp:focus{border-color:var(--ac)}
.lock-btn{width:100%;padding:16px;border-radius:12px;border:none;background:var(--ac);color:#fff;font-size:16px;font-weight:650;cursor:pointer;letter-spacing:-.01em}
.lock-btn:active{opacity:0.85}
.lock-err{font-size:13px;color:var(--dt);min-height:18px;font-weight:550}

/* MODAL */
.ov{display:none;position:fixed;inset:0;background:rgba(28,28,26,0.34);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:1000;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.modal{background:var(--bg1);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:0 0 16px}
.mdrag{width:40px;height:4px;background:var(--b2);border-radius:4px;margin:14px auto 2px;flex-shrink:0}
.mbody{padding:0 18px;display:flex;flex-direction:column;gap:14px}
.mtitle{font-size:19px;font-weight:700}
.mbadge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--pg);color:var(--pt);display:inline-block}
.mf{display:flex;flex-direction:column;gap:6px}
.mf label{font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:0.3px}
.mf input,.mf select{padding:13px;border-radius:12px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:15px;width:100%;outline:none}
.mbtns{display:flex;gap:8px;justify-content:flex-end}
.mbtns button{padding:12px 18px;border-radius:12px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);cursor:pointer;font-size:14px;font-weight:600}
.mbtns button:active{background:var(--bg3)}
.mbtns .mpri{background:var(--ac);color:#fff;border-color:var(--ac)}
.mbtns .mdel{color:var(--dt);margin-right:auto}
.rbox{font-family:monospace;font-size:12px;background:var(--bg0);border-radius:12px;padding:14px;white-space:pre;overflow-x:auto;line-height:1.9;border:1px solid var(--b1)}

/* CASH */
.cash-disp{background:var(--bg0);border-radius:14px;padding:18px;text-align:center}
.cash-lbl{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.cash-amt{font-size:36px;font-weight:800}
.cash-inp-wrap{margin-bottom:12px}
.cash-inp-lbl{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.cash-inp{width:100%;padding:16px;border-radius:14px;border:2px solid var(--ac);background:var(--bg2);color:var(--t1);font-size:22px;font-weight:700;outline:none;text-align:center}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.qbtn{padding:16px 8px;border-radius:12px;border:1.5px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:15px;font-weight:700;cursor:pointer;text-align:center}
.qbtn:active{background:var(--bg3)}
.qbtn.exact{grid-column:1/-1;background:var(--ac);color:#fff;border-color:var(--ac);font-size:16px;padding:18px}
.qbtn.exact:active{opacity:0.85}
.change-box{background:var(--bg0);border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.change-l .change-lbl{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.change-val{font-size:32px;font-weight:800;color:var(--st)}
.change-r{text-align:right}
.change-r .change-lbl{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.change-r .total-val{font-size:16px;font-weight:700}
.confirm-btn{width:100%;padding:20px;border-radius:14px;border:none;background:var(--ac);color:#fff;font-size:17px;font-weight:800;cursor:pointer;margin-bottom:8px}
.confirm-btn:active{opacity:0.85}
.confirm-btn.disabled{background:var(--bg3);color:var(--t3);opacity:1;box-shadow:none;pointer-events:none}

/* Customer selector on checkout */
.cust-search{padding:0;margin-bottom:10px}

<style>
/* ==========================================================================
   ARROYO POS — DESIGN LAYER: "CARBON COPY"
   Loaded last, so it refines the base sheet without editing it.

   Structure comes from heavy black keylines that share edges, the way cells on
   an official receipt do — not from rounded cards floating on grey. Radius is
   zero on anything structural, and kept only for things a thumb lands on.

   Three devices, used deliberately and never repeated as decoration:

:root {

     to the UI stack, where heavy weight and tight tracking still read as

.change-val, .total-val, .paycell-v, .txtot, .inv-price, .exp-amt,
.ing-stock, .qnum, .qz-no {
  font-family: var(--f-num);
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  letter-spacing: -.01em;
}

  font-variant-numeric: tabular-nums;

/* ---- 1. MASTHEAD ------------------------------------------------------ */

  color: var(--t3);
  font-size: 14px;
  line-height: 1.8;
  padding: 44px 26px;
}
.prep-empty strong { display: block; color: var(--t2); font-size: 15px; margin-bottom: 6px; }

/* Recipe grouping: a product heading, then the ingredients it consumes. */
.prep-grp {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 16px 9px;
  background: var(--bg3);
  border-bottom: 1.5px solid var(--b2);
}
.prep-grp-n { flex: 1; font-size: 15px; font-weight: 700; min-width: 0; }

.prep-yield {
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 20px;
  white-space: nowrap;
  background: var(--bg3);
  color: var(--t2);
}
.prep-yield.ok  { background: var(--sg); color: var(--st); }
.prep-yield.low { background: var(--wg); color: var(--wt); }
.prep-yield.out { background: var(--dg); color: var(--dt); }

.prep-line {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px 12px 28px;
  border-bottom: 1px solid var(--b1);
}
.prep-line-n { flex: 1; font-size: 14px; font-weight: 600; min-width: 0; }
.prep-line-s { font-size: 11px; color: var(--t3); margin-top: 2px; }
.prep-line-q {
  font-size: 13px;
  font-weight: 700;
  color: var(--ac);
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.prep-line-miss { color: var(--dt); }

/* Stock figure on an ingredient row — tabular so the column stays aligned. */
.ing-stock {
  font-size: 15px;
  font-weight: 700;
  text-align: right;
  font-variant-numeric: tabular-nums;
  min-width: 62px;
}

/* Quick +/- amounts inside the stock-adjust sheet. */
.adj-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.adj-btn {
  padding: 14px 6px;
  border-radius: 0;
  border: 1.5px solid var(--b2);
  background: var(--bg2);
  color: var(--t1);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  min-height: 44px;
}
.adj-btn:active { background: var(--bg3); transform: scale(.97); }
.adj-btn.minus { color: var(--wt); }
</style>

    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {

  /* ── query parsing (the PostgREST subset this POS actually uses) ── */
  var RESERVED = { select: 1, order: 1, limit: 1, offset: 1, on_conflict: 1 };

  function parseQuery(qs) {
    var q = { filters: [], order: null, limit: 0 };
    if (!qs) return q;
    qs.split('&').forEach(function (pair) {
      if (!pair) return;
      var eq = pair.indexOf('=');
      if (eq < 0) return;

      var val = decodeURIComponent(raw);
      var dot = val.indexOf('.');
      var op = dot < 0 ? 'eq' : val.slice(0, dot);
      var arg = dot < 0 ? val : val.slice(dot + 1);
      if (op === 'not') {
        var inner = arg.split('.');
        q.filters.push({ col: key, op: 'not_' + inner[0], arg: inner.slice(1).join('.') });
        return;
      }
      q.filters.push({ col: key, op: op, arg: arg });
    });
    return q;
  }

  function loose(a, b) {
    if (a === null || a === undefined) return b === 'null';
    return String(a) === String(b);
  }

  function passes(row, f) {
    var v = row[f.col];
    switch (f.op) {
      case 'eq':  return loose(v, f.arg);
      case 'neq': return !loose(v, f.arg);
      case 'is':  return f.arg === 'null'

        var list = f.arg.replace(/^\(|\)$/g, '').split(',').map(function (s) {
          return s.replace(/^"|"$/g, '');
        });
        return list.some(function (x) { return loose(v, x); });
      }
      case 'gte': return v >= f.arg;
      case 'lte': return v <= f.arg;
      case 'gt':  return v > f.arg;
      case 'lt':  return v < f.arg;
      case 'like':

    var qs = qmark < 0 ? '' : path.slice(qmark + 1);

    if (name.indexOf('rpc/') === 0) return json([]);
    if (!name) return json([]);

    var q = parseQuery(qs);
    var rows = tbl(name);

    if (method === 'GET' || method === 'HEAD') return json(select(name, q));

    if (method === 'POST') {
      var payload = bodyOf(init);
      if (!payload) return json([], 201);
      var list = Array.isArray(payload) ? payload : [payload];
      var made = list.map(function (r) {

        return rec;
      });
      write(db);
      return json(made, 201);
    }

    if (method === 'PATCH') {
      var patch = bodyOf(init) || {};
      var hit = [];
      rows.forEach(function (r) {
        if (q.filters.every(function (f) { return passes(r, f); })) {

      write(db);
      return json(hit);
    }

    if (method === 'DELETE') {
      var keep = [], gone = [];
      rows.forEach(function (r) {
        if (q.filters.every(function (f) { return passes(r, f); })) gone.push(r);
        else keep.push(r);
      });
      db.tables[name] = keep;
      write(db);
      return json(gone);
    }

    return json([]);
  }

  var nativeFetch = window.fetch ? window.fetch.bind(window) : null;

    // Requests built from a Request object carry method/body/headers there.

      init = init || {};
      if (!init.method) init.method = input.method;
      if (!init.headers) init.headers = input.headers;

    if (path.indexOf('/auth/v1') === 0) return handleAuth(path.slice(8), init);
    if (path.indexOf('/rest/v1') === 0) return handleRest(path.slice(8), init);
    if (path.indexOf('/index.html') === 0 || path.indexOf('/dashboard') === 0) {
      return Promise.resolve(new Response('', { status: 404 }));
    }

  };

  window.__DEMO_INFO = {
    email: DEMO_EMAIL, pass: DEMO_PASS, bizId: BIZ_ID, userId: USER_ID

// Global 401/403 handler — auto-refresh token, then show inline re-auth if needed
async function ensureAuth(){
  if(!CLOUD.token)return false;
  // Try a quick token check
  try{
    const r=await fetch(SUPA_URL+'/auth/v1/user',{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+CLOUD.token}});
    if(r.ok)return true;
    // Handle 401 (expired) AND 403 (forbidden/invalid) — both mean token is bad
    if(r.status===401||r.status===403){
      // Try refresh token first
      if(CLOUD.refresh){
        console.log('[Arroyo] Token invalid ('+r.status+') — attempting refresh...');
        const ok=await refreshSession();
        if(ok){
          console.log('[Arroyo] Token refreshed via ensureAuth');
          return true;
        }
      }
      // Refresh failed or no refresh token — show inline re-auth
      console.log('[Arroyo] Refresh failed — showing re-auth modal');
      return await showReAuthModal();
    }
  }catch(e){console.warn('[Arroyo] ensureAuth network error:',e);}
  return true; // Network error — let the actual call fail with its own error
}

// ── OFFLINE SYNC QUEUE ──────────────────────────────────────────
// Saves failed syncs to localStorage and retries when internet returns.
// Queue format: [{type:'sale'|'expense'|'void', data:{...}, ts:timestamp}]

function queueLoad(){
  try{return JSON.parse(localStorage.getItem('arroyo_sync_queue_cloudlight')||'[]');}catch(e){return[];}
}
function queueSave(q){
  try{localStorage.setItem('arroyo_sync_queue_cloudlight',JSON.stringify(q));}catch(e){}
}
function queueAdd(type,data){
  const q=queueLoad();
  // Deduplicate: don't queue the same txn_id or expense+date twice
  if(type==='sale'&&q.some(x=>x.type==='sale'&&x.data.txn_id===data.txn_id))return;
  if(type==='void'&&q.some(x=>x.type==='void'&&x.data.txn_id===data.txn_id))return;
  q.push({type,data,ts:Date.now()});
  queueSave(q);
  console.log('[Arroyo] Queued offline '+type+':',data.txn_id||data.name||'');
}
function queueCount(){return queueLoad().length;}

async function flushSyncQueue(logFn){
  const q=queueLoad();
  if(!q.length)return 0;
  if(!CLOUD.token||!CLOUD.bizId){
    if(logFn)logFn('Skipping queue flush — not connected');
    return 0;
  }
  if(logFn)logFn('Flushing '+q.length+' offline item(s)...');
  const failed=[];
  let pushed=0;
  for(const item of q){
    // Inject current bizId for items queued while offline (bizId was null)
    if(!item.data.biz_id&&CLOUD.bizId)item.data.biz_id=CLOUD.bizId;
    try{
      let ok=false;
      if(item.type==='sale'){
        const r=await fetch(SUPA_URL+'/rest/v1/sales',{method:'POST',headers:cloudHeaders(),body:JSON.stringify(item.data)});
        /* A duplicate txn_id is already-done, not a failure. 23505 is the
           Postgres unique-violation *code*, never an HTTP status, so the old
           check could never fire; PostgREST reports it as 409, or as a 400
           carrying the code in the body. */
        ok=r.ok||r.status===409;
        if(!ok&&r.status>=400&&r.status<500){
          try{const b=await r.text();if(b&&b.indexOf('23505')>-1)ok=true;}catch(e){}
        }
      } else if(item.type==='expense'){
        const r=await fetch(SUPA_URL+'/rest/v1/expenses',{method:'POST',headers:cloudHeaders(),body:JSON.stringify(item.data)});
        ok=r.ok;
      } else if(item.type==='expenseDel'){
        const r=await fetch(SUPA_URL+'/rest/v1/expenses?'+item.data.filter,{method:'DELETE',headers:cloudHeaders()});
        ok=r.ok;
      } else if(item.type==='void'){
        const r=await fetch(SUPA_URL+'/rest/v1/sales?txn_id=eq.'+item.data.txn_id+'&biz_id=eq.'+CLOUD.bizId,{method:'PATCH',headers:{...cloudHeaders(),'Prefer':'return=representation'},body:JSON.stringify({voided:true,voided_by:item.data.voided_by||'',voided_at:item.data.voided_at||new Date().toISOString()})});
        ok=r.ok;
      }
      if(ok){pushed++;}else{failed.push(item);}
    }catch(e){failed.push(item);}
  }
  queueSave(failed);
  if(logFn){
    if(pushed>0)logFn('Pushed '+pushed+' offline item(s) ✓',true);
    if(failed.length>0)logFn(failed.length+' item(s) still pending (will retry next sync)',null);
  }
  console.log('[Arroyo] Queue flush: pushed='+pushed+' failed='+failed.length);
  return pushed;
}

// Single definition of the sales row shape. Both the per-sale push and the
// bulk reconciliation use it, so the two cannot drift apart.
function salePayload(tx,bizId){
  return {biz_id:bizId||null,txn_id:tx.id,date:tx.date,total:tx.total,method:tx.method,
    items:tx.items,discount:tx.disc||0,cashier:tx.cashier||'',ref:tx.ref||'',
    voided:tx.voided||false,queue_no:tx.queueNo||null,queue_status:tx.queueStatus||'',
    queue_day:tx.queueDay||null};
}

async function syncSaleToCloud(tx){
  if(!CLOUD.token||!CLOUD.bizId){
    // Not connected — queue for later
    queueAdd('sale',salePayload(tx,null));
    return;
  }
  const payload=salePayload(tx,CLOUD.bizId);
  try{
    const r=await fetch(SUPA_URL+'/rest/v1/sales',{method:'POST',headers:cloudHeaders(),body:JSON.stringify(payload)});
    if(!r.ok&&r.status!==409){
      // Failed — add to queue
      queueAdd('sale',payload);
      console.warn('[Arroyo] Sale sync failed, queued:',tx.id);
    }
  }catch(e){
    // Network error — queue it
    queueAdd('sale',payload);
    console.warn('[Arroyo] Sale sync offline, queued:',tx.id);
  }
}
async function syncExpenseToCloud(exp){
  if(!CLOUD.token||!CLOUD.bizId){
    queueAdd('expense',{biz_id:null,name:exp.name,amount:exp.amount,cat:exp.cat,date:exp.date});
    return;
  }
  const payload={biz_id:CLOUD.bizId,name:exp.name,amount:exp.amount,cat:exp.cat,date:exp.date};
  try{
    const r=await fetch(SUPA_URL+'/rest/v1/expenses',{method:'POST',headers:cloudHeaders(),body:JSON.stringify(payload)});
    if(!r.ok)queueAdd('expense',payload);
  }catch(e){queueAdd('expense',payload);}
}
async function syncExpenseDeleteToCloud(exp){
  // Cloud rows use a uuid id; rows created offline still carry a local
  // integer id, so fall back to matching on the business + fields.
  const isUuid=typeof exp.id==='string'&&exp.id.indexOf('-')>-1;
  /* The fallback branch matches on fields rather than a key, so it has to be
     narrow enough to identify one row. biz_id+name+date alone would delete
     every expense sharing a name on the same day — two "Milk delivery" rows
     booked that morning, and both vanish. Including the amount makes a
     collision much less likely; a true duplicate is indistinguishable anyway. */
  const filter=isUuid
    ?'id=eq.'+encodeURIComponent(exp.id)
    :'biz_id=eq.'+CLOUD.bizId+'&name=eq.'+encodeURIComponent(exp.name)
      +'&date=eq.'+encodeURIComponent(exp.date)
      +'&amount=eq.'+encodeURIComponent(exp.amount);
  if(!CLOUD.token||!CLOUD.bizId){queueAdd('expenseDel',{filter:filter});return;}
  try{
    const r=await fetch(SUPA_URL+'/rest/v1/expenses?'+filter,{method:'DELETE',headers:cloudHeaders()});
    if(!r.ok)queueAdd('expenseDel',{filter:filter});
  }catch(e){queueAdd('expenseDel',{filter:filter});}
}
/* ==================================================================== *
 * DELETE A DAY'S SALES
 *
 * Built for clearing out test data. Deliberately day-scoped and password
 * gated: the existing "Clear sales data" button wipes S.sales locally but
 * never touches the cloud, so everything it deleted came straight back on
 * the next pull. These delete the cloud rows too.
 *
 * Boundaries are worked out from the local day, not from a UTC slice of the
 * timestamp — at GMT+9 an evening sale carries a UTC date of the following
 * day, so a naive `date=like.2026-08-28*` filter would delete the wrong
 * transactions and miss the ones actually on screen.
 * ==================================================================== */
function dayBounds(key){
  const parts=String(key||'').split('-');
  const y=+parts[0],mo=+parts[1]-1,d=+parts[2];
  const start=new Date(y,mo,d,0,0,0,0);
  const end=new Date(y,mo,d+1,0,0,0,0);
  return {startISO:start.toISOString(),endISO:end.toISOString()};
}

// What a given day holds, so the confirmation can state it plainly.
function daySummaryFor(key){
  const sales=(S.sales||[]).filter(function(s){return dayKey(s.date)===key;});
  const exps=(S.expenses||[]).filter(function(e){return dayKey(e.date)===key;});
  const live=sales.filter(function(s){return !s.voided;});
  return {
    sales:sales, expenses:exps,
    count:sales.length, voided:sales.length-live.length,
    total:live.reduce(function(a,s){return a+(+s.total||0);},0),
    expTotal:exps.reduce(function(a,e){return a+(+e.amount||0);},0),
    items:live.reduce(function(a,s){return a+(s.items||[]).reduce(function(x,i){return x+(+i.qty||0);},0);},0)
  };
}

/* ==================================================================== *
 * PREPARATION — raw ingredients and the recipes that consume them.
 *
 * Ingredients are held locally so the till keeps deducting stock when the
 * connection drops; the cloud copy is a mirror, pushed on a best effort.
 * This used to read recipes straight from Supabase on every sale, which
 * meant an offline till silently stopped tracking ingredient usage.
 * ==================================================================== */

function ingById(id){
  for(var i=0;i<S.ings.length;i++)if(S.ings[i].id===id)return S.ings[i];
  return null;
}
function ingLevel(i){
  var st=+i.stock||0, lo=(i.low===undefined||i.low===null)?0:+i.low;
  if(st<=0)return 'out';
  if(lo>0&&st<=lo)return 'low';
  return 'ok';
}
function lowIngs(){return S.ings.filter(function(i){return ingLevel(i)==='low';});}
function outIngs(){return S.ings.filter(function(i){return ingLevel(i)==='out';});}
function recipesFor(name){return S.recipes.filter(function(r){return r.prod===name;});}

// Rounds away binary-float drift so 0.1 + 0.2 never shows as 0.30000000000000004.
function ingRound(n){return Math.round((+n||0)*1000)/1000;}
function ingQtyStr(n,unit){
  var v=ingRound(n);
  return (Number.isInteger(v)?v:v.toFixed(2).replace(/0$/,''))+(unit?' '+unit:'');
}

// How many of a product the current ingredient stock can still produce.
// null = this product has no recipe, so its own stock count governs it.
function buildable(prodName){
  var rs=recipesFor(prodName);
  if(!rs.length)return null;
  var min=Infinity, counted=false;
  for(var k=0;k<rs.length;k++){
    var per=+rs[k].qty||0;
    if(per<=0)continue;              // a zero-quantity line consumes nothing
    var ing=ingById(rs[k].ingId);
    if(!ing)return 0;                // ingredient deleted — cannot be made
    counted=true;
    min=Math.min(min,Math.floor((+ing.stock||0)/per));
  }
  return counted?Math.max(0,min):null;
}

/* Applies a sale (dir = -1) or a void (dir = +1) to ingredient stock.
   Returns the ingredients it touched so the caller can mirror them up. */
function consumeIngredients(items,dir){
  if(!Array.isArray(items)||!S.ings.length||!S.recipes.length)return [];
  var touched={};
  items.forEach(function(it){
    var sold=+it.qty||0;
    if(sold<=0)return;
    recipesFor(it.name).forEach(function(r){
      var per=+r.qty||0;
      if(per<=0)return;
      var ing=ingById(r.ingId);
      if(!ing)return;
      ing.stock=Math.max(0,ingRound((+ing.stock||0)+dir*per*sold));
      touched[ing.id]=ing;
    });
  });
  var list=Object.keys(touched).map(function(k){return touched[k];});
  if(list.length){save();pushIngStock(list);}
  return list;
}

async function pushIngStock(list){
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return;
  try{
    var ch=cloudHeaders();
    for(var i=0;i<list.length;i++){
      if(list[i].cloudId===null||list[i].cloudId===undefined)continue;
      await fetch(SUPA_URL+'/rest/v1/ingredients?id=eq.'+encodeURIComponent(list[i].cloudId),
        {method:'PATCH',headers:ch,body:JSON.stringify({stock:list[i].stock})});
    }
  }catch(e){}
}

/* Product stock moved by a sale or a void. applyStockDelta() only touches the
   local copy, and the full push in saveProductsToCloud() may not run for
   hours — so the Dashboard's Inventory page sat on whatever stock figure was
   current at the last full sync. This PATCHes just the stock column (and
   variants, which carry their own per-variant stock) so the back office sees
   the movement straight away.

   Matched on local_id, the same key saveProductsToCloud() merges on. Only the
   stock columns are written, so nothing the Dashboard owns is overwritten. */
async function pushProductStock(items){
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return;
  if(!items||!items.length)return;
  // Collapse to one PATCH per product, however many cart lines touched it.
  var seen={},list=[];
  for(var i=0;i<items.length;i++){
    var it=items[i];
    var p=S.prods.find(function(x){return it.id!==undefined?x.id===it.id:x.name===it.name;});
    if(!p||p.id===undefined||p.id===null)continue;
    if(seen[p.id])continue;
    seen[p.id]=true;list.push(p);
  }
  if(!list.length)return;
  try{
    var ch=cloudHeaders();
    for(var j=0;j<list.length;j++){
      var pr=list[j];
      var body={stock:pr.stock};
      if(pr.variants&&pr.variants.length)body.variants=pr.variants;
      await fetch(SUPA_URL+'/rest/v1/products?biz_id=eq.'+CLOUD.bizId+'&local_id=eq.'+encodeURIComponent(pr.id),
        {method:'PATCH',headers:ch,body:JSON.stringify(body)});
    }
  }catch(e){console.warn('[Arroyo] pushProductStock failed (stock will catch up on the next full sync)',e);}
}
/* The unit cost column is named cost_per_unit — that is what the Dashboard
   writes and what its COGS, margin and P&L figures read. This used to send a
   plain `cost`, which PostgREST rejects as an unknown column, so every write
   fell through to the lean payload below and unit, low_threshold and cost
   never reached the Dashboard at all. */
/* One write attempt. On failure the body is read and kept, so a caller can
   report *why* instead of the old bare `return` that discarded everything. */
async function prepAttempt(method,url,body,last){
  /* `Prefer: return=representation` is now always sent. Without it a PATCH
     against an id that no longer exists in the cloud comes back 200 with an
     empty body, which the old code read as success — so a local row holding
     a stale cloudId reported "synced" on every attempt while never actually
     writing anything. Callers can now see that no row came back and fall
     back to an INSERT. */
  var hdrs={...cloudHeaders(),'Prefer':'return=representation'};
  var r=await fetch(SUPA_URL+url,{method:method,headers:hdrs,body:JSON.stringify(body)});
  if(r.ok){
    var rows=null;
    try{rows=await r.clone().json();}catch(e){}
    return {ok:true,res:r,rows:rows,empty:Array.isArray(rows)&&rows.length===0};
  }
  var t='';
  try{t=await r.text();}catch(e){}
  last.status=r.status;last.msg=(t||'').slice(0,200);
  return {ok:false,res:r,body:t};
}
function prepIsDuplicate(last){
  return last.status===409||String(last.msg||'').indexOf('23505')>-1||
         String(last.msg||'').toLowerCase().indexOf('duplicate key')>-1;
}

async function saveIngToCloud(ing){
  if(!CLOUD.token||!CLOUD.bizId)return {ok:false,msg:'not signed in to the cloud'};
  if(!navigator.onLine)return {ok:false,msg:'device is offline'};
  var full={biz_id:CLOUD.bizId,name:ing.name,stock:ing.stock,unit:ing.unit||'',
            cost_per_unit:+ing.cost||0,low_threshold:+ing.low||0};
  // Middle tier: drop only the cost column. The old code jumped straight to
  // name+stock, silently throwing away the unit and the low-stock threshold.
  var mid={biz_id:CLOUD.bizId,name:ing.name,stock:ing.stock,unit:ing.unit||'',low_threshold:+ing.low||0};
  var lean={biz_id:CLOUD.bizId,name:ing.name,stock:ing.stock};
  var last={status:0,msg:''};
  try{
    if(ing.cloudId!==null&&ing.cloudId!==undefined){
      var u='/rest/v1/ingredients?id=eq.'+encodeURIComponent(ing.cloudId);
      var a=await prepAttempt('PATCH',u,full,last);
      if(!a.ok)a=await prepAttempt('PATCH',u,mid,last);
      if(!a.ok)a=await prepAttempt('PATCH',u,lean,last);
      /* An empty result means the id is stale — the row was removed on the
         Dashboard, or this device is holding an id from another business.
         Drop it and fall through to an INSERT rather than reporting a
         success that wrote nothing. */
      if(a.ok&&a.empty){ing.cloudId=null;save();}
      else if(a.ok){ing.syncDirty=false;save();return {ok:true};}
      else return {ok:false,status:last.status,msg:last.msg};
    }
    var c=await prepAttempt('POST','/rest/v1/ingredients',full,last);
    if(!c.ok)c=await prepAttempt('POST','/rest/v1/ingredients',mid,last);
    if(!c.ok)c=await prepAttempt('POST','/rest/v1/ingredients',lean,last);
    if(!c.ok){
      /* A duplicate name means the row is already up there under an id this
         device never recorded. Claim that id rather than reporting a failure
         and leaving every recipe that points here permanently blocked. */
      if(prepIsDuplicate(last)){
        try{
          var f=await fetch(SUPA_URL+'/rest/v1/ingredients?biz_id=eq.'+CLOUD.bizId+'&name=eq.'+encodeURIComponent(ing.name),{headers:cloudHeaders()});
          if(f.ok){
            var ex=await f.json();
            if(Array.isArray(ex)&&ex[0]&&ex[0].id!=null){ing.cloudId=ex[0].id;ing.syncDirty=false;save();return {ok:true,adopted:true};}
          }
        }catch(e){}
      }
      return {ok:false,status:last.status,msg:last.msg||'write rejected'};
    }
    var rows=c.rows;
    if(rows===null||rows===undefined){try{rows=await c.res.json();}catch(e){}}
    if(Array.isArray(rows)&&rows[0]&&rows[0].id!==undefined){ing.cloudId=rows[0].id;ing.syncDirty=false;save();return {ok:true};}
    return {ok:false,status:0,msg:'saved but the server returned no id'};
  }catch(e){return {ok:false,status:0,msg:(e&&e.message)||'network error'};}
}

/* A recipe line can only be written once its ingredient holds a cloud id.
   Every caller used to fire saveRecipeToCloud() straight after creating a
   brand-new ingredient, while that ingredient's own POST was still in
   flight — so the recipe came back "blocked", the result was thrown away
   unread, and the line never reached the Dashboard. This resolves the
   ingredient first and reports honestly. */
async function ensureIngCloudId(ing){
  if(!ing)return false;
  if(ing.cloudId!==null&&ing.cloudId!==undefined)return true;
  var r=await saveIngToCloud(ing);
  return !!(r&&r.ok&&ing.cloudId!==null&&ing.cloudId!==undefined);
}

async function delIngFromCloud(ing){
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return;
  if(ing.cloudId===null||ing.cloudId===undefined)return;
  try{
    var ch=cloudHeaders(), cid=encodeURIComponent(ing.cloudId);
    // Recipe lines first, or they would point at an ingredient that is gone.
    await fetch(SUPA_URL+'/rest/v1/recipes?biz_id=eq.'+CLOUD.bizId+'&ingredient_id=eq.'+cid,{method:'DELETE',headers:ch});
    await fetch(SUPA_URL+'/rest/v1/ingredients?id=eq.'+cid,{method:'DELETE',headers:ch});
  }catch(e){}
}

async function saveRecipeToCloud(r){
  if(!CLOUD.token||!CLOUD.bizId)return {ok:false,msg:'not signed in to the cloud'};
  if(!navigator.onLine)return {ok:false,msg:'device is offline'};
  var ing=ingById(r.ingId);
  if(!ing)return {ok:false,msg:'its ingredient no longer exists on this device'};
  /* Push the ingredient up first if it has never been written. Previously
     this returned "blocked" and gave up, which is why a recipe added in the
     same breath as a new ingredient could never sync — nothing ever came
     back to retry it. */
  if(ing.cloudId===null||ing.cloudId===undefined){
    var okIng=await ensureIngCloudId(ing);
    if(!okIng)return {ok:false,blocked:true,msg:'is waiting on ingredient "'+(ing.name||'?')+'" to sync first'};
  }
  /* ingredient_name is denormalised alongside ingredient_id — the Dashboard
     always writes it, so a row created here without it left a null the
     Dashboard's recipe list and reports read as blank. */
  var row={biz_id:CLOUD.bizId,product_name:r.prod,ingredient_id:ing.cloudId,
           ingredient_name:ing.name||'',qty_used:+r.qty||0};
  var lean={biz_id:CLOUD.bizId,product_name:r.prod,ingredient_id:ing.cloudId,qty_used:+r.qty||0};
  var last={status:0,msg:''};
  try{
    if(r.cloudId!==null&&r.cloudId!==undefined){
      var u='/rest/v1/recipes?id=eq.'+encodeURIComponent(r.cloudId);
      var a=await prepAttempt('PATCH',u,row,last);
      if(!a.ok)a=await prepAttempt('PATCH',u,lean,last);
      /* Empty result = the line is gone from the cloud (commonly removed on
         the Dashboard). Forget the id and insert it again instead of
         reporting a silent success forever. */
      if(a.ok&&a.empty){r.cloudId=null;save();}
      else if(a.ok){r.syncDirty=false;save();return {ok:true};}
      else return {ok:false,status:last.status,msg:last.msg};
    }
    var c=await prepAttempt('POST','/rest/v1/recipes',row,last);
    if(!c.ok)c=await prepAttempt('POST','/rest/v1/recipes',lean,last);
    if(!c.ok){
      // Same line already up there (usually added from the Dashboard) — claim
      // its id instead of failing forever.
      if(prepIsDuplicate(last)){
        try{
          var f=await fetch(SUPA_URL+'/rest/v1/recipes?biz_id=eq.'+CLOUD.bizId
            +'&product_name=eq.'+encodeURIComponent(r.prod)
            +'&ingredient_id=eq.'+encodeURIComponent(ing.cloudId),{headers:cloudHeaders()});
          if(f.ok){
            var ex=await f.json();
            if(Array.isArray(ex)&&ex[0]&&ex[0].id!=null){r.cloudId=ex[0].id;r.syncDirty=false;save();return {ok:true,adopted:true};}
          }
        }catch(e){}
      }
      return {ok:false,status:last.status,msg:last.msg||'write rejected'};
    }
    var rows=c.rows;
    if(rows===null||rows===undefined){try{rows=await c.res.json();}catch(e){}}
    if(Array.isArray(rows)&&rows[0]&&rows[0].id!==undefined){r.cloudId=rows[0].id;r.syncDirty=false;save();return {ok:true};}
    return {ok:false,status:0,msg:'saved but the server returned no id'};
  }catch(e){return {ok:false,status:0,msg:(e&&e.message)||'network error'};}
}

async function delRecipeFromCloud(r){
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return;
  if(r.cloudId===null||r.cloudId===undefined)return;
  try{
    await fetch(SUPA_URL+'/rest/v1/recipes?id=eq.'+encodeURIComponent(r.cloudId),{method:'DELETE',headers:cloudHeaders()});

/* ==================================================================== *
 * PREP SYNC RETRY
 *
 * Ingredients and recipe lines used to be written with a bare
 * `saveRecipeToCloud(r)` — no await, no look at the result. Anything that
 * failed (offline, expired session, ingredient not yet in the cloud) was
 * gone: nothing recorded the failure, so nothing ever tried again, and the
 * till kept showing "Recipe line added" while the Dashboard stayed empty.
 *
 * Every local write now marks the row dirty and clears the mark only once
 * the cloud has confirmed it. Anything still dirty is retried on reconnect,
 * on sign-in and on a slow timer, and the Prep tab shows the outstanding
 * count so a failure is visible instead of silent.
 * ==================================================================== */
function markIngDirty(ing){if(ing)ing.syncDirty=true;}
function markRecipeDirty(r){if(r)r.syncDirty=true;}

function prepPendingCount(){
  var n=0;
  (S.ings||[]).forEach(function(i){if(i.syncDirty||i.cloudId===null||i.cloudId===undefined)n++;});
  (S.recipes||[]).forEach(function(r){if(r.syncDirty||r.cloudId===null||r.cloudId===undefined)n++;});
  return n;
}

/* Writes one ingredient and reports the outcome to the person at the till. */
async function syncIngNow(ing,quiet){
  markIngDirty(ing);save();
  if(!CLOUD.token||!CLOUD.bizId){if(!quiet)toast('Saved on this device — sign in to sync');return false;}
  if(!navigator.onLine){if(!quiet)toast('Saved offline — will sync when back online');return false;}
  var res=await saveIngToCloud(ing);
  if(res&&res.ok){if(!quiet)toast('Ingredient synced');render();return true;}
  if(!quiet)toast('Sync failed: '+((res&&res.msg)||'unknown')+' — will retry');
  render();
  return false;
}

/* Writes one recipe line, pulling its ingredient up first if it has never
   been synced. This is the path the recipe modal now awaits. */
async function syncRecipeNow(r,quiet){
  markRecipeDirty(r);save();
  if(!CLOUD.token||!CLOUD.bizId){if(!quiet)toast('Saved on this device — sign in to sync');return false;}
  if(!navigator.onLine){if(!quiet)toast('Saved offline — will sync when back online');return false;}
  var res=await saveRecipeToCloud(r);
  if(res&&res.ok){if(!quiet)toast('Recipe synced to Dashboard');render();return true;}
  if(!quiet)toast('Recipe sync failed: '+((res&&res.msg)||'unknown')+' — will retry');
  render();
  return false;
}

var PREP_RETRY_RUNNING=false;
/* Retries everything still outstanding. Ingredients go first — a recipe line
   cannot be written until the ingredient it points at has an id. */
async function retryPrepSync(log){
  if(PREP_RETRY_RUNNING)return {ings:0,recipes:0,failed:0};
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return {ings:0,recipes:0,failed:0};
  var dirtyIngs=(S.ings||[]).filter(function(i){return i.syncDirty||i.cloudId===null||i.cloudId===undefined;});
  var dirtyRecs=(S.recipes||[]).filter(function(r){return r.syncDirty||r.cloudId===null||r.cloudId===undefined;});
  if(!dirtyIngs.length&&!dirtyRecs.length)return {ings:0,recipes:0,failed:0};
  PREP_RETRY_RUNNING=true;
  var stat={ings:0,recipes:0,failed:0};
  try{
    for(var i=0;i<dirtyIngs.length;i++){
      var ri=await saveIngToCloud(dirtyIngs[i]);
      if(ri&&ri.ok)stat.ings++;else stat.failed++;
    }
    for(var j=0;j<dirtyRecs.length;j++){
      var rr=await saveRecipeToCloud(dirtyRecs[j]);
      if(rr&&rr.ok)stat.recipes++;else stat.failed++;
    }
    save();
    if(log)log('Retried prep data: '+stat.ings+' ingredient(s), '+stat.recipes+' recipe line(s)'+(stat.failed?', '+stat.failed+' still pending':''),stat.failed===0);
  }catch(e){}
  PREP_RETRY_RUNNING=false;
  return stat;
}

/* Pulls whatever the Dashboard has, matching cloud rows to local ones by
   stored cloud id first and by name second, so an ingredient typed on this
   till and the same ingredient created on the Dashboard converge instead
   of appearing twice. */
async function loadIngredientsFromCloud(){
  if(!CLOUD.token||!CLOUD.bizId)return;
  var ch=cloudHeaders(), ingRows=null, recRows=null;
  try{
    var r1=await fetch(SUPA_URL+'/rest/v1/ingredients?biz_id=eq.'+CLOUD.bizId,{headers:ch});
    if(r1.ok)ingRows=await r1.json();
  }catch(e){}
  try{
    var r2=await fetch(SUPA_URL+'/rest/v1/recipes?biz_id=eq.'+CLOUD.bizId,{headers:ch});
    if(r2.ok)recRows=await r2.json();
  }catch(e){}
  if(!Array.isArray(ingRows))return;

  ingRows.forEach(function(row){
    if(row.id===undefined||row.id===null)return;
    var local=null;
    for(var i=0;i<S.ings.length;i++){
      var x=S.ings[i];
      if(x.cloudId!==null&&x.cloudId!==undefined&&String(x.cloudId)===String(row.id)){local=x;break;}
    }
    if(!local){
      for(var j=0;j<S.ings.length;j++){
        var y=S.ings[j];
        if((y.cloudId===null||y.cloudId===undefined)&&String(y.name||'').trim().toLowerCase()===String(row.name||'').trim().toLowerCase()){local=y;break;}
      }
    }
    if(!local){
      local={id:S.ingNid++,cloudId:row.id,name:row.name||'Ingredient',unit:'',stock:0,low:0,cost:0};
      S.ings.push(local);
    }
    local.cloudId=row.id;
    /* A row still waiting to be pushed keeps its local values. Overwriting it
       from the cloud here used to quietly undo whatever the till had just
       typed, which looked exactly like "the edit didn't save". */
    if(local.syncDirty)return;
    if(row.name)local.name=row.name;
    if(row.stock!==undefined&&row.stock!==null)local.stock=ingRound(row.stock);
    if(row.unit!==undefined&&row.unit!==null)local.unit=row.unit;
    /* Read cost_per_unit — the column the Dashboard writes. Older rows may
       still carry a plain `cost`, so accept either and prefer the new one. */
    var rowCost=(row.cost_per_unit!==undefined&&row.cost_per_unit!==null)?row.cost_per_unit
               :((row.cost!==undefined&&row.cost!==null)?row.cost:null);
    if(rowCost!==null)local.cost=+rowCost||0;
    if(row.low_threshold!==undefined&&row.low_threshold!==null)local.low=+row.low_threshold||0;
  });

  if(Array.isArray(recRows))recRows.forEach(function(row){
    if(row.id===undefined||row.id===null)return;
    var ing=null;
    for(var i=0;i<S.ings.length;i++){
      var x=S.ings[i];
      if(x.cloudId!==null&&x.cloudId!==undefined&&String(x.cloudId)===String(row.ingredient_id)){ing=x;break;}
    }
    if(!ing)return;
    var ex=null;
    for(var j=0;j<S.recipes.length;j++){
      var r=S.recipes[j];
      if((r.cloudId!==null&&r.cloudId!==undefined&&String(r.cloudId)===String(row.id))||
         (r.prod===row.product_name&&r.ingId===ing.id)){ex=r;break;}
    }
    if(!ex){ex={id:S.recipeNid++,cloudId:row.id,prod:row.product_name,ingId:ing.id,qty:0};S.recipes.push(ex);}
    ex.cloudId=row.id;
    // Same rule as ingredients: an unpushed local edit wins over the cloud.
    if(ex.syncDirty)return;
    ex.prod=row.product_name;
    ex.ingId=ing.id;
    ex.qty=+row.qty_used||0;
  });
  save();
}
async function loadCloudData(silent){
  if(!CLOUD.token||!CLOUD.bizId)return;
  if(!silent)toast('Syncing from cloud...');
  try{
    const ch=cloudHeaders();
    /* These limits have to be at least as generous as the ones reconcileSales
       and reconcileExpenses read with (10000). They used to be 500 and 200, so
       a full sync pushed everything up and then pulled back only the newest
       slice — older sales stayed safe in the cloud but vanished from this
       device's History, which reads as data loss to whoever is at the till. */
    const [sales,expenses,prods]=await Promise.all([
      fetch(SUPA_URL+'/rest/v1/sales?biz_id=eq.'+CLOUD.bizId+'&order=date.desc&limit=10000',{headers:ch}).then(r=>r.json()),
      fetch(SUPA_URL+'/rest/v1/expenses?biz_id=eq.'+CLOUD.bizId+'&order=date.desc&limit=10000',{headers:ch}).then(r=>r.json()),
      fetch(SUPA_URL+'/rest/v1/products?biz_id=eq.'+CLOUD.bizId,{headers:ch}).then(r=>r.json()),
    ]);
    if(Array.isArray(sales)){
      /* salePayload sends queue_no / queue_status / queue_day up, but nothing
         read them back, so every full sync silently stripped the queue
         numbers off this device's sales. */
      /* The cloud has no `receipt` column, so a pull would blank the receipt
         text for sales this device took. Keep whatever is already held
         locally for the same txn_id. The breakdown no longer depends on it,
         but the original slip is still worth not throwing away. */
      const oldReceipts={};
      (S.sales||[]).forEach(function(o){if(o&&o.id&&o.receipt)oldReceipts[o.id]=o.receipt;});
      S.sales=sales.map(s=>({id:s.txn_id,date:s.date,total:s.total,method:s.method,items:s.items||[],cashier:s.cashier||'',ref:s.ref||'',voided:s.voided||false,receipt:s.receipt||oldReceipts[s.txn_id]||'',disc:s.discount||0,voidedBy:s.voided_by||'',voidedAt:s.voided_at||'',queueNo:s.queue_no||0,queueStatus:s.queue_status||'',queueDay:s.queue_day||null}));
      S.salesTotal=S.sales.filter(s=>!s.voided).reduce((a,s)=>a+s.total,0);
    }
    if(Array.isArray(expenses)){S.expenses=expenses.map(e=>({id:e.id,name:e.name,amount:e.amount,cat:e.cat,date:e.date}));}
    if(Array.isArray(prods)&&prods.length>0){
      S.prods=prods.map(p=>({id:p.local_id||p.id,name:p.name,price:p.price,cat:p.cat,icon:p.icon||'ITEM',stock:p.stock,variants:p.variants||[],img:p.img||null,salePct:p.sale_pct||0,barcode:p.barcode||''}));
      const cs=[...new Set(S.prods.map(p=>p.cat))];S.cats=['All',...cs];
      // Keep the local id counter ahead of every id that exists (incl. ones
      // the Dashboard created) or new POS products will collide on local_id.
      const maxId=S.prods.reduce(function(mx,p){return Math.max(mx,parseInt(p.id)||0);},0);
      if(S.nid<=maxId)S.nid=maxId+1;
    }
    save();if(!silent)toast('Cloud sync complete');
  }catch(e){if(!silent)toast('Sync error — using local data');}
  await loadSettingsFromCloud();
  await loadCloudCustomers();
  await loadAttEmployees();
  await loadIngredientsFromCloud();
  /* Push anything the till created while it was signed out or offline. The
     pull above only brings the Dashboard's copy down; without this a locally
     created recipe would keep losing to it. */
  await retryPrepSync();
}
async function saveProductsToCloud(){
  if(!CLOUD.token||!CLOUD.bizId)return false;
  // Safety: never wipe cloud products if local is empty — pull instead
  if(S.prods.length===0){
    await loadCloudData(true);
    return true;
  }
  // Always ensure auth before writing — handles expired JWT and refresh token, shows re-auth if needed
  const authOk=await ensureAuth();
  if(!authOk){console.error('saveProductsToCloud: auth failed — aborting');return false;}
  try{
    let ch=cloudHeaders();
    // --- SMART MERGE (replaces wipe+repost) ---
    // Fetch current cloud products so we can diff instead of overwrite.
    // This preserves any edits made from the Dashboard.
    /* null means "this run never learned what the cloud holds"; [] means the
       cloud genuinely holds nothing. Conflating the two was the bug: a failed
       fetch left an empty array, every local product then looked new, and the
       loop below posted a second copy of all of them. */
    let cloudProds=null;
    try{
      const fetchRes=await fetch(SUPA_URL+'/rest/v1/products?biz_id=eq.'+CLOUD.bizId,{headers:ch});
      if(fetchRes.ok){
        const body=await fetchRes.json();
        if(Array.isArray(body))cloudProds=body;
        else console.warn('[Arroyo] saveProductsToCloud: cloud fetch returned non-array');
      } else {
        console.warn('[Arroyo] saveProductsToCloud: cloud fetch failed',fetchRes.status);
      }
    }catch(e){console.warn('[Arroyo] saveProductsToCloud: could not fetch cloud products',e);}

    /* No fallback wipe+repost here. Deleting every cloud product on the
       strength of a read that just failed would also delete anything the
       Dashboard added and this device has not pulled yet. Report the failure
       and let the next sync try again — the local copy is untouched. */
    if(cloudProds===null){
      console.error('saveProductsToCloud: could not read cloud products — aborting rather than overwriting');
      return false;
    }

    // Build lookup maps: local_id → cloud row (uuid), local_id → local prod
    const cloudByLocalId={};
    cloudProds.forEach(function(cp){if(cp.local_id!=null)cloudByLocalId[cp.local_id]=cp;});
    const localIds=new Set(S.prods.map(function(p){return p.id;}));

    // 1. DELETE cloud rows whose local_id no longer exists in POS
    const toDelete=cloudProds.filter(function(cp){return cp.local_id!=null&&!localIds.has(cp.local_id);});
    for(const cp of toDelete){
      try{
        await fetch(SUPA_URL+'/rest/v1/products?id=eq.'+cp.id,{method:'DELETE',headers:ch});
      }catch(e){console.warn('[Arroyo] saveProductsToCloud: delete failed for',cp.id,e);}
    }

    // 2. PATCH existing or POST new for each local product
    /* Only thrown network errors were caught here; an HTTP rejection (bad
       column, RLS denial, constraint violation) was never looked at, so this
       function returned true no matter what and the sync log always said
       "Products pushed". Count real outcomes instead. */
    let pFail=0,lastErr='';
    for(const p of S.prods){
      const existing=cloudByLocalId[p.id];
      const row={biz_id:CLOUD.bizId,local_id:p.id,name:p.name,price:p.price,cat:p.cat,icon:p.icon,stock:p.stock,variants:p.variants||[],img:p.img||null,sale_pct:p.salePct||0,barcode:p.barcode||null};
      try{
        let res;
        if(existing){
          // PATCH — only fields POS owns; preserve dashboard-only fields that POS doesn't touch
          res=await fetch(SUPA_URL+'/rest/v1/products?id=eq.'+existing.id,{method:'PATCH',headers:{...ch,'Prefer':'return=representation'},body:JSON.stringify(row)});
        }else{
          // POST — new product added on POS
          res=await fetch(SUPA_URL+'/rest/v1/products',{method:'POST',headers:{...ch,'Prefer':'return=representation'},body:JSON.stringify(row)});
        }
        if(!res.ok){
          pFail++;
          try{lastErr=(await res.text()||'').slice(0,200);}catch(e){}
          console.warn('[Arroyo] saveProductsToCloud: '+(existing?'PATCH':'POST')+' rejected for local_id',p.id,res.status,lastErr);
        }
      }catch(e){pFail++;lastErr=(e&&e.message)||'network error';console.warn('[Arroyo] saveProductsToCloud: upsert failed for local_id',p.id,e);}
    }
    console.log('[Arroyo] saveProductsToCloud: smart merge complete. local='+S.prods.length+' cloud_before='+cloudProds.length+' failed='+pFail);
    if(pFail>0){console.error('saveProductsToCloud: '+pFail+' product(s) rejected. Last error: '+lastErr);return false;}
    return true;
  }catch(e){console.error('saveProductsToCloud error:',e);return false;}
}

/* ==================================================================== *
 * FULL SYNC — push everything this till holds up to the Dashboard.
 *
 * The per-action pushes already queue on failure, but a queue lives in
 * localStorage and can be cleared, and a sale recorded before a device was
 * ever signed in has nothing to queue against. So rather than trusting the
 * queue alone, this reconciles: it reads what the cloud already has and
 * sends only what is missing. Running it twice is harmless.
 * ==================================================================== */

function chunkList(arr,n){
  const out=[];
  for(let i=0;i<arr.length;i+=n)out.push(arr.slice(i,i+n));
  return out;
}

// Ingredients and recipes made on this device carry no cloud id until they
// are pushed, so they are what a full sync has to chase.
function unsyncedPrepCount(){
  let n=0;
  S.ings.forEach(function(i){if(i.cloudId===null||i.cloudId===undefined)n++;});
  S.recipes.forEach(function(r){if(r.cloudId===null||r.cloudId===undefined)n++;});
  return n;
}

async function reconcileSales(log){
  const stat={pushed:0,failed:0,voidsFixed:0,readOk:false};
  let rows=null;
  try{
    const r=await fetch(SUPA_URL+'/rest/v1/sales?biz_id=eq.'+CLOUD.bizId+'&select=txn_id,voided&limit=10000',
      {headers:cloudHeaders()});
    if(r.ok)rows=await r.json();
  }catch(e){}
  if(!Array.isArray(rows)){
    log('Could not read cloud sales - skipped the sales check',false);
    return stat;
  }
  stat.readOk=true;

  const cloudVoid={};
  rows.forEach(function(x){cloudVoid[String(x.txn_id)]=!!x.voided;});

  const missing=S.sales.filter(function(s){return !(String(s.id) in cloudVoid);});
  // A void recorded here while the cloud copy still reads as a live sale
  // would otherwise overstate takings on the Dashboard.
  const staleVoids=S.sales.filter(function(s){
    return s.voided&&(String(s.id) in cloudVoid)&&cloudVoid[String(s.id)]===false;
  });

  if(!missing.length){
    log('All '+S.sales.length+' local sales are already on the Dashboard',true);
  } else {
    log('Found '+missing.length+' sale(s) missing from the Dashboard...');
    const batches=chunkList(missing.map(function(s){return salePayload(s,CLOUD.bizId);}),50);
    for(let b=0;b<batches.length;b++){
      let ok=false;
      try{
        const r=await fetch(SUPA_URL+'/rest/v1/sales',
          {method:'POST',headers:cloudHeaders(),body:JSON.stringify(batches[b])});
        ok=r.ok;
      }catch(e){}
      if(ok){stat.pushed+=batches[b].length;continue;}
      // One bad row fails a whole batch, so fall back to a row at a time.
      for(let i=0;i<batches[b].length;i++){
        try{
          const r2=await fetch(SUPA_URL+'/rest/v1/sales',
            {method:'POST',headers:cloudHeaders(),body:JSON.stringify(batches[b][i])});
          if(r2.ok||r2.status===409)stat.pushed++;else stat.failed++;
        }catch(e){stat.failed++;}
      }
    }
    log('Pushed '+stat.pushed+' sale(s)'+(stat.failed?', '+stat.failed+' failed':''),stat.failed===0);
  }

  for(let i=0;i<staleVoids.length;i++){
    const s=staleVoids[i];
    try{
      const r=await fetch(SUPA_URL+'/rest/v1/sales?txn_id=eq.'+encodeURIComponent(s.id)+'&biz_id=eq.'+CLOUD.bizId,
        {method:'PATCH',headers:cloudHeaders(),
         body:JSON.stringify({voided:true,voided_by:s.voidedBy||'',voided_at:s.voidedAt||new Date().toISOString()})});
      if(r.ok)stat.voidsFixed++;
    }catch(e){}
  }
  if(stat.voidsFixed)log('Marked '+stat.voidsFixed+' sale(s) as voided on the Dashboard',true);
  return stat;
}

async function reconcileExpenses(log){
  const stat={pushed:0,failed:0,readOk:false};
  if(!S.expenses.length){stat.readOk=true;log('No expenses to check',true);return stat;}
  let rows=null;
  try{
    const r=await fetch(SUPA_URL+'/rest/v1/expenses?biz_id=eq.'+CLOUD.bizId+'&select=name,amount,date&limit=10000',
      {headers:cloudHeaders()});
    if(r.ok)rows=await r.json();
  }catch(e){}
  if(!Array.isArray(rows)){
    log('Could not read cloud expenses - skipped the expenses check',false);
    return stat;
  }
  stat.readOk=true;
  // Expenses share no stable id between device and cloud, so match on the
  // exact creation timestamp plus name. Skipping a genuine duplicate is far
  // less damaging than posting the same expense twice.
  const key=function(n,d){return String(n||'')+'|'+String(d||'');};
  const have={};
  rows.forEach(function(x){have[key(x.name,x.date)]=true;});
  const missing=S.expenses.filter(function(e){return !have[key(e.name,e.date)];});
  if(!missing.length){log('All '+S.expenses.length+' expense(s) are already on the Dashboard',true);return stat;}

  log('Found '+missing.length+' expense(s) missing...');
  for(let i=0;i<missing.length;i++){
    const e=missing[i];
    try{
      const r=await fetch(SUPA_URL+'/rest/v1/expenses',{method:'POST',headers:cloudHeaders(),
        body:JSON.stringify({biz_id:CLOUD.bizId,name:e.name,amount:e.amount,cat:e.cat,date:e.date})});
      if(r.ok)stat.pushed++;else stat.failed++;
    }catch(err){stat.failed++;}
  }
  log('Pushed '+stat.pushed+' expense(s)'+(stat.failed?', '+stat.failed+' failed':''),stat.failed===0);
  return stat;
}

/* Claims the cloud ids for prep rows that are already up there.

   This has to run before anything is written. pushPrepData() used to POST
   straight away, and the only code that ever matched a local ingredient to an
   existing cloud row by name was loadIngredientsFromCloud() — which runs at
   the *end* of a full sync, after the push. So an ingredient created on the
   Dashboard, or one whose id was lost when an earlier push died halfway,
   arrived here with no cloudId, POSTed a second copy, and where the table has
   a unique index on (biz_id, name) was rejected outright. Either way it came
   away without an id, and since a recipe line cannot be written until its
   ingredient has one, a single stuck ingredient silently blocked every recipe
   that used it. That is the "failed" the sync log was reporting.

   Only ids are taken here — stock, cost, unit and quantities are untouched —
   so this stays safe to run before an upload: nothing local is overwritten. */
async function adoptPrepCloudIds(log){
  if(!CLOUD.token||!CLOUD.bizId||!navigator.onLine)return false;
  var ch=cloudHeaders(), ingRows=null, recRows=null;
  try{
    var r1=await fetch(SUPA_URL+'/rest/v1/ingredients?biz_id=eq.'+CLOUD.bizId,{headers:ch});
    if(r1.ok)ingRows=await r1.json();
  }catch(e){}
  try{
    var r2=await fetch(SUPA_URL+'/rest/v1/recipes?biz_id=eq.'+CLOUD.bizId,{headers:ch});
    if(r2.ok)recRows=await r2.json();
  }catch(e){}
  if(!Array.isArray(ingRows)){
    if(log)log('Could not read the Dashboard\u2019s ingredient list \u2014 pushing without it',false);
    return false;
  }
  var norm=function(v){return String(v||'').trim().toLowerCase();};
  var adopted=0;
  var byName={};
  ingRows.forEach(function(row){if(row&&row.id!=null)byName[norm(row.name)]=row.id;});
  S.ings.forEach(function(i){
    if(i.cloudId!==null&&i.cloudId!==undefined)return;
    var hit=byName[norm(i.name)];
    if(hit!=null){i.cloudId=hit;adopted++;}
  });
  if(Array.isArray(recRows)){
    var recKey={};
    recRows.forEach(function(row){
      if(row&&row.id!=null)recKey[norm(row.product_name)+'|'+String(row.ingredient_id)]=row.id;
    });
    S.recipes.forEach(function(r){
      if(r.cloudId!==null&&r.cloudId!==undefined)return;
      var ing=ingById(r.ingId);
      if(!ing||ing.cloudId===null||ing.cloudId===undefined)return;
      var hit=recKey[norm(r.prod)+'|'+String(ing.cloudId)];
      if(hit!=null){r.cloudId=hit;adopted++;}
    });
  }
  if(adopted){
    save();
    if(log)log('Matched '+adopted+' entr'+(adopted===1?'y':'ies')+' that already existed on the Dashboard',true);
  }
  return true;
}

async function pushPrepData(log){
  const stat={ings:0,recipes:0,ingFail:0,recFail:0,blocked:0};
  if(!S.ings.length&&!S.recipes.length){log('No ingredients or recipes to push',true);return stat;}
  // Claim any ids that already exist up there before writing anything.
  await adoptPrepCloudIds(log);
  // Ingredients first: a recipe cannot be written until the ingredient it
  // points at has a cloud id to reference.
  for(let i=0;i<S.ings.length;i++){
    const ing=S.ings[i];
    const res=await saveIngToCloud(ing);
    if(res&&res.ok)stat.ings++;
    else{
      stat.ingFail++;
      log('Ingredient \u201c'+(ing.name||'?')+'\u201d failed'
        +(res&&res.status?' ('+res.status+')':'')
        +(res&&res.msg?': '+res.msg:''),false);
    }
  }
  if(S.ings.length)log('Pushed '+stat.ings+' of '+S.ings.length+' ingredient(s)',stat.ingFail===0);
  for(let j=0;j<S.recipes.length;j++){
    const rec=S.recipes[j];
    const res=await saveRecipeToCloud(rec);
    if(res&&res.ok)stat.recipes++;
    else if(res&&res.blocked){
      stat.blocked++;
      log('Recipe for \u201c'+(rec.prod||'?')+'\u201d '+res.msg,false);
    } else {
      stat.recFail++;
      log('Recipe for \u201c'+(rec.prod||'?')+'\u201d failed'
        +(res&&res.status?' ('+res.status+')':'')
        +(res&&res.msg?': '+res.msg:''),false);
    }
  }
  if(S.recipes.length)log('Pushed '+stat.recipes+' of '+S.recipes.length+' recipe line(s)',(stat.recFail+stat.blocked)===0);
  return stat;
}

/* Runs the whole push. log(msg, ok) receives progress; ok is true for a
   success line, false for a failure, undefined for plain progress. */
async function syncEverything(log){
  log=log||function(){};
  if(!CLOUD.token||!CLOUD.bizId){
    log('Not signed in. Open Admin and sign in to the cloud first.',false);
    return {ok:false,reason:'signed-out'};
  }
  if(!navigator.onLine){
    log('This device is offline. Reconnect and try again - nothing is lost in the meantime.',false);
    return {ok:false,reason:'offline'};
  }

  log('Checking session...');
  const authed=await ensureAuth();
  if(!authed){log('Session could not be renewed.',false);return {ok:false,reason:'auth'};}
  log('Session OK',true);

  const pending=queueCount();
  if(pending>0){
    log('Pushing '+pending+' queued item(s)...');
    await flushSyncQueue(log);
  } else {
    log('Nothing waiting in the offline queue',true);
  }

  const sales=await reconcileSales(log);
  const exps=await reconcileExpenses(log);
  const failed=sales.failed+exps.failed;
  // A failed *read* is as dangerous as a failed write: it means this run
  // never established what the Dashboard already holds, so it cannot know
  // whether the local records are safely up there. Pulling on that basis
  // could replace them with an empty or partial result.
  const blind=!sales.readOk||!exps.readOk;

  /* Anything that downloads has to wait until every upload has landed.
     loadCloudData() replaces S.sales and S.expenses outright, and
     saveProductsToCloud() quietly falls back to a full download when this
     device has no products — so both are off limits while records are still
     unsent, or the pull would erase exactly what failed to go up.
     Pushing settings and prep data is still safe: neither reads anything
     back. A stale local copy is recoverable; a deleted sale is not. */
  if(failed>0||blind){
    if(failed>0)log('Finished with '+failed+' item(s) still unsent.',false);
    await saveSettingsToCloud();
    await pushPrepData(log);
    log('Held back the download so nothing on this device is overwritten. Try again in a moment.','warn');
    save();
    return {ok:false,sales:sales,expenses:exps,reason:failed>0?'partial':'unverified'};
  }

  log('Pushing '+S.prods.length+' product(s)...');
  const prodOk=await saveProductsToCloud();
  log(prodOk?'Products pushed':'Products failed to push',prodOk);

  const setOk=await saveSettingsToCloud();
  log(setOk?'Shop settings pushed':'Settings failed to push (non-critical)',setOk);

  const prep=await pushPrepData(log);
  /* Anything still without a cloud id after the push did not land. The old
     code reported {ok:prodOk} only, so a run that failed to push a single
     ingredient or recipe still told the user "Sync complete". */
  const prepLeft=unsyncedPrepCount();
  if(prepLeft>0)log(prepLeft+' ingredient/recipe entr'+(prepLeft===1?'y':'ies')+' still not on the Dashboard',false);

  log('Pulling the latest back from the Dashboard...');
  await loadCloudData(true);
  save();
  const allOk=prodOk&&prepLeft===0;
  log(allOk?'Everything on this device is now on the Dashboard.'
           :'Finished, but some items did not go up — run this again in a moment.',allOk);
  return {ok:allOk,sales:sales,expenses:exps,prep:prep,settings:setOk,prepLeft:prepLeft,reason:allOk?'':'partial'};
}

async function checkForUpdate(){
  try{
    const r=await fetch(VERSION_URL+'?t='+Date.now());
    if(!r.ok)return{status:'error',msg:'Could not reach update server.'};
    const data=await r.json();
    const latest=data.version||'0';
    const current=CR.ver;
    if(latest===current)return{status:'latest',version:latest};
    // Compare versions
    const parts=function(v){return v.split('.').map(Number);};
    const lp=parts(latest),cp=parts(current);
    let newer=false;
    for(let i=0;i<Math.max(lp.length,cp.length);i++){
      const l=lp[i]||0,c=cp[i]||0;
      if(l>c){newer=true;break;}
      if(l<c){break;}
    }
    if(newer)return{status:'available',version:latest,notes:data.notes||''};
    return{status:'latest',version:latest};
  }catch(e){return{status:'error',msg:'Network error. Check your connection.'};}
}

}

/* ==================================================================== *
 * PHOTO HANDLING
 *
 * Uploads used to be stored exactly as the camera produced them — a phone
 * photo is several megabytes once base64-encoded, and localStorage holds
 * roughly five in total for the whole app. Two unprocessed photos could
 * fill it, at which point save() started throwing and the till silently
 * stopped persisting sales. Every picture is now scaled down to something
 * a 3-column grid can actually use before it is ever stored.
 *
 * Aspect ratio is preserved rather than cropped: a tall bottle and a wide
 * tray both keep all of themselves, and the CSS letterboxes them into the
 * card. Nothing is cut off and nothing is stretched.
 * ==================================================================== */
const IMG_MAX_EDGE=512;     // ample for a product tile on a 2x phone screen
const IMG_LOGO_EDGE=256;
const IMG_QUALITY=0.82;

// base64 characters -> approximate kilobytes of real data
function imgKB(chars){return Math.max(1,Math.round((chars||0)*0.75/1024));}

function processImage(file,maxEdge){
  return new Promise(function(resolve,reject){
    if(!file)return reject(new Error('No file chosen'));
    if(!/^image\//.test(file.type||''))return reject(new Error('That file is not an image'));
    const reader=new FileReader();
    reader.onerror=function(){reject(new Error('Could not read that file'));};
    reader.onload=function(ev){
      const src=String(ev.target.result||'');
      const img=new Image();
      img.onerror=function(){reject(new Error('That image could not be opened'));};
      img.onload=function(){
        const w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        if(!w||!h)return reject(new Error('That image has no size'));
        // Shrink the longest edge to the limit. Never scale a small picture
        // up — that adds bytes without adding any detail.
        const scale=Math.min(1,(maxEdge||IMG_MAX_EDGE)/Math.max(w,h));
        const tw=Math.max(1,Math.round(w*scale)), th=Math.max(1,Math.round(h*scale));
        let out;
        try{
          const c=document.createElement('canvas');
          c.width=tw;c.height=th;
          const ctx=c.getContext('2d');
          if(!ctx)throw new Error('no 2d context');
          ctx.imageSmoothingEnabled=true;
          if('imageSmoothingQuality' in ctx)ctx.imageSmoothingQuality='high';
          // White underlay so a transparent PNG does not turn black once
          // it is flattened into a JPEG.
          ctx.fillStyle='#ffffff';ctx.fillRect(0,0,tw,th);
          ctx.drawImage(img,0,0,tw,th);
          out=c.toDataURL('image/jpeg',IMG_QUALITY);
        }catch(e){return reject(new Error('This browser could not resize that image'));}
        // A already-tiny source can come out larger after re-encoding, so
        // keep whichever is smaller. Processing never makes things worse.
        const best=(out&&out.length<src.length)?out:src;
        resolve({data:best,w:tw,h:th,before:src.length,after:best.length});
      };
      img.src=src;
    };
    reader.readAsDataURL(file);
  });
}
